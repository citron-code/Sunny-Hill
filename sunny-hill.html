<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9ddc6e">
<title>Sunny Hill</title>
<style>
:root{
  --ink:#4a3222; --cream:#fffdf6; --sun:#ffc93c; --orange:#ff8c42; --green:#4cc36a; --blue:#4aa3ff; --pink:#ff7aa2;
  --shadow:0 6px 18px rgba(74,50,34,.22);
  --font:"Comic Sans MS","Chalkboard SE","Comic Neue","Trebuchet MS",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ddc6e;font-family:var(--font);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:none}
body.g3 #gl{display:block}
#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:60}
.hidden{display:none!important}

/* ---------- buttons ---------- */
.btn{font-family:var(--font);font-weight:bold;font-size:22px;min-width:56px;min-height:56px;padding:0 18px;border:0;border-radius:20px;
  color:#fff;background:var(--orange);box-shadow:0 5px 0 rgba(0,0,0,.18),var(--shadow);cursor:pointer;touch-action:manipulation;
  transition:transform .08s ease,box-shadow .08s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1;
  -webkit-appearance:none;appearance:none;outline:none}
.btn:active{transform:translateY(3px) scale(.93);box-shadow:0 2px 0 rgba(0,0,0,.18),var(--shadow)}
.btn:focus-visible{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--blue)}
.btn.round{padding:0;width:56px;border-radius:50%}
.btn.green{background:var(--green)} .btn.blue{background:var(--blue)} .btn.pink{background:var(--pink)}
.btn.yellow{background:var(--sun);color:var(--ink)} .btn.white{background:#fff;color:var(--ink)}
.btn.wide{width:100%;min-height:62px;font-size:24px}
.card{background:var(--cream);border-radius:22px;box-shadow:var(--shadow);border:3px solid #fff}

/* ---------- HUD ---------- */
#questCard{position:fixed;z-index:10;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;padding:5px 8px 5px 5px;max-width:min(440px,calc(100vw - 130px));
  cursor:pointer;min-height:66px;transition:transform .08s}
#questCard:active{transform:scale(.96)}
#qcPortrait{width:56px;height:56px;border-radius:50%;flex:0 0 auto}
#qcText{font-size:20px;font-weight:bold;line-height:1.15}
#qcSpeak{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#topRight{position:fixed;z-index:10;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:10px;align-items:center}
#starBox{font-size:24px;font-weight:bold;padding:0 16px;height:56px;display:flex;align-items:center;gap:6px;white-space:nowrap}
#starBox.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.3)}}
@media (max-width:640px){
  #topRight{flex-direction:column-reverse;align-items:flex-end;gap:8px}
  #starBox{height:46px;font-size:22px;padding:0 12px}
  #qcPortrait{width:48px;height:48px}
  #qcSpeak{position:absolute;left:33px;top:35px;width:30px;height:30px;font-size:15px;border:2px solid #fff}
  #questCard{min-height:58px;gap:8px;max-width:calc(100vw - 150px);padding-right:12px}
  #qcText{line-height:1.08}
}
.row .btn{padding:0 8px;font-size:22px;white-space:nowrap}

/* ---------- talk button ---------- */
#talkWrap{position:fixed;left:0;top:0;z-index:12;will-change:transform}
#talkBtn{position:relative;background:var(--sun);color:var(--ink);font-size:24px;border:4px solid #fff;white-space:nowrap;animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{top:0}50%{top:-7px}}

/* ---------- dialog ---------- */
#dialog{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
  width:min(940px,calc(100vw - 20px));display:flex;align-items:center;gap:14px;padding:12px 14px;
  background:var(--cream);border:4px solid var(--sun);border-radius:28px;box-shadow:0 10px 30px rgba(74,50,34,.3)}
#dialog.pop{animation:dlgPop .22s ease-out}
@keyframes dlgPop{from{opacity:0;margin-bottom:-14px}to{opacity:1;margin-bottom:0}}
#dlgWho{flex:0 0 auto}
#dlgPortrait{display:block;width:88px;height:88px;border-radius:50%;border:4px solid #fff;box-shadow:var(--shadow)}
#dlgMain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
#dlgName{background:var(--orange);color:#fff;font-weight:bold;font-size:20px;padding:2px 12px;border-radius:14px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#dlgText{font-size:clamp(22px,2.6vw,30px);line-height:1.4;font-weight:bold;min-height:2.8em;display:flex;align-items:center}
.w{border-radius:8px;padding:0 2px;transition:background-color .12s,color .12s}
.w.said{color:#e0651a}
.w.now{background:#ffe066;color:var(--ink)}
#dlgBtns{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;align-items:stretch}
#dlgNext{font-size:24px;min-width:128px}
@media (max-width:620px){
  #dialog{flex-wrap:wrap;gap:8px 12px;padding:10px 12px;align-items:flex-start}
  #dlgPortrait{width:60px;height:60px}
  #dlgMain{flex:1 1 0}
  #dlgText{font-size:22px;min-height:0}
  #dlgBtns{flex-direction:row;width:100%;justify-content:flex-end}
  #dlgNext{flex:1 1 auto}
}
@media (max-height:480px) and (orientation:landscape){
  #dialog{padding:8px 12px;width:min(900px,calc(100vw - 20px))}
  #dlgPortrait{width:58px;height:58px}
  #dlgText{font-size:22px;min-height:0}
  #dlgBtns{flex-direction:row}
}

/* ---------- banner (Great job!) ---------- */
#banner{position:fixed;z-index:40;left:50%;top:40%;transform:translate(-50%,-50%);padding:16px 34px;font-size:clamp(34px,7vw,64px);font-weight:bold;color:#fff;
  background:linear-gradient(#ffc23c,#ff8c42);border:6px solid #fff;border-radius:34px;box-shadow:0 12px 30px rgba(0,0,0,.25);
  text-shadow:0 3px 0 rgba(0,0,0,.18);white-space:nowrap;pointer-events:none;animation:bannerIn .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes bannerIn{from{transform:translate(-50%,-50%) scale(.2);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.flyStar{position:fixed;z-index:45;font-size:64px;pointer-events:none;transition:transform .9s cubic-bezier(.5,-0.3,.7,1),opacity .9s}

/* ---------- overlays (title, menu) ---------- */
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-start;justify-content:flex-start;padding:16px;background:rgba(40,28,18,.45);overflow:auto;-webkit-overflow-scrolling:touch}
.overlay>*{margin:auto}
.panel{width:min(420px,100%);padding:20px;display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.panel h2{margin:0 0 4px;font-size:30px}
.panel p{margin:0;font-size:22px}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.btn.sel{background:var(--green);box-shadow:0 0 0 4px #fff inset,0 5px 0 rgba(0,0,0,.18)}
.btn.unsel{background:#c9bfb4}
#title{background:linear-gradient(#7fd3ff 0%,#bdeaff 55%,#9ddc6e 55.1%,#86cf5c 100%);z-index:35}
#titleBox{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
#titleBox h1{margin:0;font-size:clamp(52px,12vw,96px);color:#fff;letter-spacing:1px;
  text-shadow:0 5px 0 #ff8c42,0 9px 0 rgba(0,0,0,.15);-webkit-text-stroke:3px var(--ink)}
.sunBall{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fff3a0,#ffc93c 60%,#ffa928);
  border:5px solid var(--ink);box-shadow:0 0 0 14px rgba(255,220,90,.45),0 0 0 28px rgba(255,220,90,.2)}
#startBtn{font-size:34px;min-height:78px;padding:0 44px;border-radius:28px}
#titleHi{font-size:28px;font-weight:bold;min-height:1.2em}
#ask{z-index:55}

/* ---------- toast (short feedback) ---------- */
#toast{position:fixed;z-index:42;left:50%;top:calc(84px + env(safe-area-inset-top));transform:translateX(-50%);max-width:calc(100vw - 20px);
  padding:8px 22px;background:#fff;border:4px solid var(--green);border-radius:24px;box-shadow:var(--shadow);font-size:26px;font-weight:bold;
  text-align:center;white-space:nowrap;pointer-events:none;animation:toastIn .3s cubic-bezier(.2,1.5,.4,1)}
#toast.bad{border-color:var(--pink)}
@keyframes toastIn{from{opacity:0;margin-top:-16px}to{opacity:1;margin-top:0}}
@media (max-width:640px){#toast{top:calc(126px + env(safe-area-inset-top));font-size:22px}}

/* ---------- mini games ---------- */
#mg{z-index:25}
#mgCard{width:min(840px,100%);max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
#mgHead{display:flex;align-items:center;gap:10px}
#mgPortrait{width:64px;height:64px;border-radius:50%;flex:0 0 auto;border:3px solid #fff;box-shadow:var(--shadow)}
#mgPrompt{flex:1 1 auto;min-width:0;font-size:clamp(24px,3.4vw,34px);font-weight:bold;line-height:1.2}
#mgQuit{flex:0 0 auto;font-size:22px}
#mgBody{display:flex;flex-direction:column;gap:12px}
#mgFoot{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;position:sticky;bottom:0;background:var(--cream)}
#mgDots{display:flex;gap:8px;flex-wrap:wrap}
#mgDots span{width:18px;height:18px;border-radius:50%;background:#e8dccb;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
#mgDots span.on{background:var(--sun)}
#mgDots span.cur{background:var(--orange)}
#mgNext{font-size:24px;min-width:140px}
.pick{background:#fff;border:4px solid #fff;border-radius:22px;box-shadow:0 4px 0 rgba(0,0,0,.12),var(--shadow);cursor:pointer;padding:6px;margin:0;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font-family:var(--font);font-weight:bold;font-size:22px;color:var(--ink);
  touch-action:manipulation;transition:transform .08s;min-width:56px;min-height:56px;position:relative;-webkit-appearance:none;appearance:none;outline:none}
.pick:active{transform:scale(.94)}
.pick canvas{display:block;width:100%;height:auto;pointer-events:none}
.pick.ok{border-color:var(--green);background:#e6ffe6}
.pick.sel{border-color:var(--orange);background:#fff3e0}
.pick.lock{opacity:.6;cursor:default}
.hint{animation:glow 1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px #ffd23c,0 0 0 8px rgba(255,210,60,.35)}50%{box-shadow:0 0 0 5px #ffd23c,0 0 22px 12px rgba(255,200,40,.95)}}
.shake{animation:shake .42s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.photo{background:linear-gradient(#bfeaff 0%,#e3f6ff 58%,#b4ea86 58.1%,#9ddc6e 100%);border:10px solid #c98552;border-radius:16px;
  box-shadow:inset 0 0 0 3px #a8693a,var(--shadow);padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo .pick{background:rgba(255,255,255,.35);border-color:rgba(255,255,255,.7);box-shadow:none}
.photo .pick.ok{background:rgba(220,255,220,.85);border-color:var(--green)}
.whereWrap{display:flex;gap:12px;align-items:stretch}
.whereWho{flex:0 0 150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:22px;font-weight:bold;text-align:center}
.whereWho canvas{width:130px;height:130px;border-radius:50%;border:4px solid #fff;box-shadow:var(--shadow)}
.whereRow{flex:1 1 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seqSlots,.seqCards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seqCards{min-height:150px}
.slot{min-height:150px;border:4px dashed #d9c3a0;border-radius:22px;display:flex;align-items:stretch;justify-content:center;position:relative;padding:4px}
.slot b{position:absolute;left:10px;top:4px;font-size:28px;color:#c9a878}
.slot .pick{width:100%}
.tfRow{display:flex;gap:20px;justify-content:center}
.tfBtn{font-size:72px;min-width:150px;min-height:120px;border-radius:30px}
.tfBtn.up{background:var(--green)} .tfBtn.down{background:#ff8a5c}
.tfBtn.ok{box-shadow:0 0 0 5px #fff,0 0 0 10px var(--green)}
.say{font-size:clamp(22px,3vw,30px);font-weight:bold;background:#fff7d6;border-radius:18px;padding:10px 14px;text-align:center}
.famPhoto{width:auto;height:auto;max-width:100%;max-height:36vh;margin:0 auto;display:block;border:10px solid #c98552;border-radius:16px;box-shadow:inset 0 0 0 3px #a8693a,var(--shadow)}
.famGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;align-items:start}
.famGrid .pick canvas{width:auto;height:84px}
.badge{position:absolute;top:-8px;right:-8px;min-width:32px;height:32px;border-radius:16px;background:var(--orange);color:#fff;font-size:20px;
  display:flex;align-items:center;justify-content:center;border:3px solid #fff;padding:0 4px}
.undoRow{display:flex;justify-content:flex-end}
.ageRow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ageRow .pick{font-size:48px;min-height:100px;justify-content:center}
.flagGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.flagGrid .pick{font-size:20px;line-height:1.1}
.lines div{font-size:clamp(22px,3vw,30px);font-weight:bold;padding:4px 10px;border-radius:12px;transition:background .15s}
.lines div.now{background:#ffe066}
@media (max-width:620px){
  #mgCard{padding:10px;gap:10px}
  #mgPortrait{width:48px;height:48px}
  #mgPrompt{font-size:22px}
  .photo{padding:6px;border-width:7px;gap:5px}
  .whereWrap{flex-direction:column}
  .whereWho{flex:0 0 auto;flex-direction:row}
  .whereWho canvas{width:84px;height:84px}
  .tfBtn{min-width:120px;min-height:100px;font-size:60px}
  .slot,.seqCards{min-height:118px}
  .pick{font-size:20px;border-radius:18px}
  .ageRow .pick{min-height:80px;font-size:40px}
  .famGrid .pick canvas{height:64px}
}
@media (max-height:480px) and (orientation:landscape){
  #mgPortrait{width:44px;height:44px}
  #mgPrompt{font-size:22px}
  .photo{grid-template-columns:repeat(6,1fr)}
  .whereWho canvas{width:90px;height:90px}
  .flagGrid{grid-template-columns:repeat(8,1fr)}
  #mgCard{padding:8px;gap:6px}
  #mgHead{gap:6px}
  .slot{min-height:92px}
  .seqCards{min-height:0}
  .slot .pick canvas,.seqCards .pick canvas{width:auto;height:58px}
  .famGrid{grid-template-columns:repeat(5,1fr);gap:6px}
  .famGrid .pick canvas{height:44px}
  .famPhoto{max-height:30vh}
  .tfBtn{min-height:88px}
  .whereRow .pick canvas{width:auto;height:88px}
}

/* ---------- parent screen, character creator, wardrobe, certificate ---------- */
.sky{background:linear-gradient(#7fd3ff,#bdeaff 55%,#9ddc6e 55.1%,#86cf5c)!important}
.parentCard{width:min(580px,100%);text-align:left}
.parentCard h2{text-align:center;font-size:clamp(24px,5vw,32px);line-height:1.2}
.parentCard ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.parentCard li{font-size:20px;line-height:1.3}
#pControls{font-size:20px;background:#eaf6ff;border-radius:14px;padding:8px 12px;margin:0}
#pCredit{text-align:center;font-size:20px;color:#8a6a50}
#pVoice{display:flex;align-items:center;gap:10px;font-size:20px;background:#effbe8;border-radius:14px;padding:8px 8px 8px 12px}
#pVoice.bad{background:#fff0e6}
#pVoiceText{flex:1 1 auto;line-height:1.3}
#pVoiceTest{flex:0 0 auto;font-size:20px}
#voiceWarn{position:fixed;z-index:58;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);width:min(560px,calc(100vw - 20px));
  padding:12px 14px;display:flex;align-items:center;gap:12px;border-color:#ffb38a;font-size:20px;line-height:1.3}
#vwText{flex:1 1 auto}
#vwOk{flex:0 0 auto}
@media (max-width:520px){ #voiceWarn,#pVoice{flex-direction:column;align-items:stretch} }
.lbl{background:none;border:0;padding:4px 0;font-family:var(--font);font-weight:bold;font-size:24px;color:var(--ink);cursor:pointer;text-align:left;min-height:56px;touch-action:manipulation}
.crCard{width:min(540px,100%);gap:10px}
.crTop{display:flex;gap:12px;align-items:center}
#crPreview{width:130px;height:auto;flex:0 0 auto;background:radial-gradient(circle at 50% 60%,#fff,#bfeaff);border-radius:22px}
.crName{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}
#crName{font-family:var(--font);font-size:26px;font-weight:bold;padding:10px 14px;border-radius:16px;border:3px solid #e0cdb0;width:100%;color:var(--ink);
  background:#fff;min-height:56px;-webkit-user-select:text;user-select:text}
#crName:focus{outline:none;border-color:var(--orange)}
.swRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.swRow .ico{font-size:30px;width:42px;text-align:center}
.sw{width:56px;height:56px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.15);cursor:pointer;touch-action:manipulation;padding:0;-webkit-appearance:none;appearance:none}
.sw.sel{box-shadow:0 0 0 4px var(--ink)}
.bodyBtn{width:96px}
#wardrobe{z-index:34}
.wardCard{width:min(560px,100%)}
.wardTop{display:flex;gap:12px;align-items:center}
#wdPreview{width:140px;height:auto;flex:0 0 auto;background:radial-gradient(circle at 50% 60%,#fff,#ffe7a8);border-radius:22px}
#wdItems{flex:1 1 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#cert{z-index:32}
#certCard{width:min(720px,100%);max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:8px solid #ffd23c}
#certTitle{font-size:clamp(30px,6vw,46px);font-weight:bold;color:#fff;background:linear-gradient(#ffc23c,#ff8c42);border-radius:20px;padding:6px 22px;text-shadow:0 3px 0 rgba(0,0,0,.18)}
#certPics{display:flex;gap:10px;align-items:flex-end;justify-content:center;width:100%}
#certPlayer{width:100px;height:auto;flex:0 0 auto}
#certPhoto{flex:0 1 auto;min-width:0;max-width:min(440px,calc(100% - 80px));max-height:34vh;width:auto;height:auto;border:8px solid #c98552;border-radius:14px}
#certName{font-size:clamp(30px,6vw,44px);font-weight:bold;line-height:1.1}
#certStars{font-size:clamp(24px,5vw,34px);letter-spacing:2px}
#certDate{font-size:20px;color:#8a6a50}
#certNote{font-size:20px;background:#eaf6ff;border-radius:14px;padding:6px 12px}
#certCard .row{width:100%}
@media (max-width:520px){
  #certPlayer{width:64px}
  #certTitle{font-size:26px;padding:4px 14px}
  #certName{font-size:30px}
  #certCard{padding:12px;gap:6px}
  #certCard .row{flex-direction:column;gap:8px}
  .crCard{padding:14px}
  .swRow{gap:8px}
  .swRow .ico{width:32px;font-size:26px}
}
@media (max-height:480px) and (orientation:landscape){
  #certTitle{font-size:26px;padding:2px 14px}
  #certPlayer{width:60px}
  #certPhoto{max-height:30vh}
  #certName{font-size:28px}
  #certCard{padding:10px;gap:4px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="game"></canvas>

<div id="questCard" class="card hidden" role="button" aria-label="Quest">
  <canvas id="qcPortrait" width="112" height="112"></canvas>
  <div id="qcText"></div>
  <div id="qcSpeak" aria-hidden="true">🔊</div>
</div>
<div id="topRight" class="hidden">
  <div id="starBox" class="card">⭐ <span id="starCount">0</span>/<span id="starTotal">8</span></div>
  <button id="menuBtn" class="btn round white" aria-label="Menu">⚙️</button>
</div>

<div id="talkWrap" class="hidden"><button id="talkBtn" class="btn">Talk 💬</button></div>

<div id="dialog" class="hidden">
  <div id="dlgWho"><canvas id="dlgPortrait" width="176" height="176"></canvas></div>
  <div id="dlgMain"><div id="dlgName"></div><div id="dlgText"></div></div>
  <div id="dlgBtns">
    <button id="dlgSpeak" class="btn round blue" aria-label="Listen again">🔊</button>
    <button id="dlgNext" class="btn green">Next ▶</button>

const TAU = Math.PI * 2;
const INK = '#4a3222';
const FONT = '"Comic Sans MS","Chalkboard SE","Comic Neue","Trebuchet MS",sans-serif';

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) { // deterministic, so the village looks the same every time
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0; let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shade(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (a < 0) { r *= 1 + a; g *= 1 + a; b *= 1 + a; } else { r += (255 - r) * a; g += (255 - g) * a; b += (255 - b) * a; }
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}

/* ---- primitives ---- */
function rrPath(c, x, y, w, h, r) {
  if (w < 0) { x += w; w = -w; } if (h < 0) { y += h; h = -h; }
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function paint(c, fill, lw) {
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (lw) { c.lineWidth = lw; c.strokeStyle = INK; c.stroke(); }
}
function rrect(c, x, y, w, h, r, fill, lw = 3) { c.beginPath(); rrPath(c, x, y, w, h, r); paint(c, fill, lw); }
function circ(c, x, y, r, fill, lw = 3) { c.beginPath(); c.arc(x, y, r, 0, TAU); paint(c, fill, lw); }
function ell(c, x, y, rx, ry, fill, lw = 3, rot = 0) { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); paint(c, fill, lw); }
function poly(c, pts, fill, lw = 3) {
  c.beginPath(); c.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
  c.closePath(); paint(c, fill, lw);
}
function seg(c, x0, y0, x1, y1, col, lw) { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.strokeStyle = col; c.lineWidth = lw; c.stroke(); }
function shadowE(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fillStyle = 'rgba(70,50,20,.2)'; c.fill(); }
function starPath(c, x, y, r, rot) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot - Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.5 : r;
    c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  c.closePath();
}
/* Blobs drawn "all outlines first, then all fills" merge into one outlined shape. */
function blobs(c, list, fill, lw) {
  c.lineWidth = lw * 2; c.strokeStyle = INK;
  for (const b of list) { c.beginPath(); c.arc(b[0], b[1], b[2], 0, TAU); c.stroke(); }
  c.fillStyle = fill;
  for (const b of list) { c.beginPath(); c.arc(b[0], b[1], b[2], 0, TAU); c.fill(); }
}

/* ---- sprite cache: static art is drawn once per zoom level ---- */
const SPRITES = {};
function defSprite(key, b, fn) { SPRITES[key] = { b, fn }; }

  get(key) {
    let cv = this.cache.get(key);

    if (n.path && (play || !n.wander) && !(n.wander && near)) { followPath(n, dt, n.wander ? n.speed : 90); continue; }

    if (near || dp < 150) { n.dir = faceDir(player.x - n.x, (player.y - n.y) * 1.4, n.dir); continue; }
    if (n.wander && play && (n.wait -= dt) < 0) {
      n.wait = 1.5 + n.R() * 3;

/* ---- Nomi's animals (Quest 4): they wander, follow you, and walk into the pen ---- */
const PEN_GATE = { x: 322, y: 940 };
const HERD_DEFS = [
  { id: 'goat', area: { x0: 1080, y0: 600, x1: 1300, y1: 720 }, pen: { x: 168, y: 915 } },
  { id: 'lamb', area: { x0: 860, y0: 860, x1: 1030, y1: 960 }, pen: { x: 212, y: 990 } },
  { id: 'horse', area: { x0: 440, y0: 570, x1: 610, y1: 700 }, pen: { x: 248, y: 918 } },
];
const HERD = [];
function initHerd() {
  for (const d of HERD_DEFS) {
    const a = {
      id: d.id, kind: d.id, x: d.pen.x, y: d.pen.y, face: 1, phase: 0, moving: false, st: 'pen', area: d.area, pen: d.pen,
      path: null, pathI: 0, wait: 1, stuck: 0, R: rng(d.pen.x * 13 + d.pen.y), t0: d.pen.x * 0.01,
      b: d.id === 'horse' ? [-50, -104, 60, 8] : [-32, -58, 36, 8],
    };
    a.draw = function (c, t) {
      const o = { x: this.x, y: this.y, face: this.face, moving: this.moving, phase: this.phase, t: t + this.t0 };
      if (this.kind === 'goat') drawGoat(c, o); else if (this.kind === 'lamb') drawLamb(c, o); else drawHorse(c, o);
    };
    HERD.push(a);
  }
}
function placeHerd() {
  const C = Quests.content(), out = C && C.id === 'animals';
  for (const a of HERD) {
    a.path = null; a.moving = false;
    if (!out || (state.q.home && state.q.home.indexOf(a.id) >= 0)) { a.st = 'pen'; a.x = a.pen.x; a.y = a.pen.y; a.face = 1; }
    else { a.st = 'wander'; const p = randomFreePoint(a.area, a.R); if (p) { a.x = p.x; a.y = p.y; } }
  }
}
function updateHerd(dt) {
  const C = Quests.content(), active = C && C.id === 'animals' && state.stage === 'active' && game.mode === 'play';
  let fi = 0;
  for (const a of HERD) {
    if (a.st === 'pen') { a.moving = false; continue; }
    if (a.st === 'going') {
      if (a.path) followPath(a, dt, 80);
      if (!a.path) { a.st = 'pen'; a.moving = false; if (Math.hypot(a.x - a.pen.x, a.y - a.pen.y) > 30) { a.x = a.pen.x; a.y = a.pen.y; } }
      continue;
    }
    if (a.st === 'follow') {
      updateFollower(a, 80 + fi * 40, dt); fi++;
      // in they go once you reach the pen with them (the last one may still be a few steps behind)
      if (Math.hypot(a.x - PEN_GATE.x, a.y - PEN_GATE.y) < 110 || Math.hypot(player.x - PEN_GATE.x, player.y - PEN_GATE.y) < 120) {
        a.st = 'going'; a.path = findPath(a.x, a.y, a.pen.x, a.pen.y); a.pathI = 0;
        if (state.q.home.indexOf(a.id) < 0) state.q.home.push(a.id);
        Sfx.play('ok'); Toast.show('🏠 ' + (C.sounds[a.kind] || '')); Speech.speak(C.sounds[a.kind] || '', { who: 'nomi' });
        saveAndRefresh();
      }
      continue;
    }
    if (game.mode !== 'play') { a.moving = false; continue; }
    if (a.path) followPath(a, dt, 34);
    else {
      a.moving = false;
      if ((a.wait -= dt) < 0) { a.wait = 2 + a.R() * 3; const p = randomFreePoint(a.area, a.R); if (p) { a.path = findPath(a.x, a.y, p.x, p.y); a.pathI = 0; } }
    }
    if (active && Math.hypot(player.x - a.x, player.y - a.y) < 72) {
      a.st = 'follow'; a.path = null; Sfx.play('pop');
      Toast.show(C.sounds[a.kind] || ''); Speech.speak(C.sounds[a.kind] || '', { who: 'nomi' });
    }
  }
}

  talk(id) { const L = this.logic(); return !!(L && L.talk(id, this.content())); },

    return null;
  },

  complete() {
    const C = this.content();
    if (state.done.indexOf(C.id) < 0) state.done.push(C.id);
    state.stars = Math.min(SETTINGS.totalStars, state.stars + 1);
    state.quest++; state.stage = 'available'; state.q = {};

function saveAndRefresh() { Save.save(); Hud.refresh(); }
function carryTake(it) { state.q.carry = it.id; Sfx.play('pick'); Hud.refresh(); }
function nearestOf(list) {

    if (!q1) {
      n.wander = MAP.wander; n.speed = id === 'nomi' ? 55 : 64;
      if (instant) { const p = randomFreePoint(MAP.wander, R); if (p) { n.x = p.x; n.y = p.y; } }
    } else sendHome(n, instant);
  }
  const L = Quests.logic(), C = Quests.content();
  if (instant) {
    if (L && L.restore) L.restore();
    NPC.pip.sleeping = NPC.pop.sleeping = false; game.sleepT = 0;
  }
  if (instant || (C && C.id === 'animals')) placeHerd();
  LANDMARK.myHouse.unlocked = state.quest >= Quests.index('final');
}

/* ============================== MİNİ OYUNLAR ============================== */
/* Her mini oyun ayrı bir fonksiyon: MINI.<ad>(C, bitince). C = görevin GAME_CONTENT kaydı.
   Yeni bir ünite için mini oyunu olduğu gibi bırakıp yalnızca GAME_CONTENT'i değiştirmek yeterli.
   Ortak parçalar: MG (açılır pencere), pickBtn (resimli buton), sayThen (konuş, bitince devam et). */
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function cnv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function fmt(s, vars) { return fillName(String(s).replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] != null ? vars[k] : m))); }
function speechMs(text) { const r = Speech.rate(); return String(text).split(' ').reduce((a, w) => a + (0.12 + w.length * 0.065) / r, 0.3) * 1000; }
/* Speak, then run cb once when the voice finishes, or after a safe timeout if it never reports back. */
function sayThen(text, who, cb) {
  const h = { dead: false, t: 0, cancel() { this.dead = true; clearTimeout(this.t); } };
  const fin = () => { if (h.dead) return; h.dead = true; clearTimeout(h.t); if (cb) cb(); };
  const est = speechMs(text);
  const ok = Speech.speak(text, { who, onEnd: fin });
  h.t = setTimeout(fin, ok ? est * 1.8 + 1500 : 600 + est * 0.5);
  return h;
}
function pickBtn(draw, label, cw, ch, cls) {
  const b = el('button', 'pick' + (cls ? ' ' + cls : ''));
  if (draw) { const c = cnv(cw || 180, ch || 200); draw(c); b.appendChild(c); }
  if (label) b.appendChild(el('span', null, String(label).replace(/^grand(?=\w)/, 'grand​')));   // "grand|mother" may wrap
  return b;
}
const MG = {                      // the mini game window
  token: 0, who: 'sparky', speech: null, onQuit: null, onReplay: null, text: '',
  open(who, onQuit) {
    this.token++; this.who = who; this.onQuit = onQuit || null; this.onReplay = null;
    if (this.speech) this.speech.cancel();
    drawPortrait($('mgPortrait'), who);
    $('mgBody').innerHTML = ''; $('mgDots').innerHTML = ''; $('mgPrompt').textContent = '';
    this.next(null);
    $('mg').classList.remove('hidden'); $('mgCard').scrollTop = 0;
    setMode('minigame'); Talk.hide();
    return this.token;
  },
  alive(tok) { return tok === this.token && game.mode === 'minigame'; },
  prompt(text, speak) { this.text = text; $('mgPrompt').textContent = text; if (speak !== false) this.say(text); },
  say(text, cb) { if (this.speech) this.speech.cancel(); this.speech = sayThen(text, this.who, cb); },
  replay() { if (this.onReplay) this.onReplay(); else if (this.text) this.say(this.text); },
  dots(i, n) { const d = $('mgDots'); d.innerHTML = ''; for (let k = 0; k < n; k++) d.appendChild(el('span', k < i ? 'on' : k === i ? 'cur' : '')); },
  next(label, fn) {
    const b = $('mgNext');
    if (!label) { b.classList.add('hidden'); b.onclick = null; return; }
    b.textContent = label; b.classList.remove('hidden');
    b.onclick = (e) => { e.stopPropagation(); b.blur(); Sfx.play('tap'); fn(); };
  },
  close() {
    this.token++; if (this.speech) this.speech.cancel(); this.speech = null; this.onReplay = null;
    Speech.stop(); $('mg').classList.add('hidden'); setMode('play'); Hud.refresh();
  },
  quit() { const f = this.onQuit; this.close(); if (f) f(); },
  wrong(btn, correct, count, hintAfter) {       // gentle sound, "Try again!", then a glowing hint
    Sfx.play('no');
    btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
    Toast.show(GAME_CONTENT.ui.tryAgain, true);
    this.say(GAME_CONTENT.ui.tryAgain);
    if (correct && count >= (hintAfter || 2)) correct.classList.add('hint');
  },
};

function familySentences(C) {              // "This is my family. I have a mother, one sister and two cousins. ..."
  const S = C.sentences, out = [S.family], parts = [];
  for (const m of C.members) {
    const n = (state.family && state.family[m]) || 0;
    if (!n) continue;
    const word = n === 1 ? m : (C.plurals[m] || m + 's');
    const num = n === 1 && C.useA.indexOf(m) >= 0 ? (/^[aeiou]/i.test(word) ? 'an' : 'a') : (C.numbers[n] || String(n));
    parts.push(num + ' ' + word);
  }
  if (parts.length) {
    const list = parts.length > 1 ? parts.slice(0, -1).join(', ') + ' ' + C.and + ' ' + parts[parts.length - 1] : parts[0];
    out.push(fmt(S.have, { list }));
  }
  out.push(fmt(S.age, { age: C.numbers[state.age] || state.age }));
  const co = C.countries.find((x) => x.id === state.country) || C.countries[0];
  out.push(fmt(S.from, { country: co.name }));
  return out;
}

const game = { mode: 'title', t: 0, paused: false, sleepT: 0, ev: 0 };

const FROZEN = { title: 1, parent: 1, creator: 1, minigame: 1, menu: 1, wardrobe: 1, cert: 1, ask: 1 };
function setMode(m) { game.mode = m; }
function fillName(s) { return String(s).replace(/\{name\}/g, state.name || GAME_CONTENT.defaultName); }
function charName(id) { const c = GAME_CONTENT.characters[id]; return c ? fillName(c.name) : id; }

/* ---- interaction ---- */
function interactables() {
  const list = [];
  for (const n of NPCS) {
    if (n.hidden || n.follow || n.sleeping) continue;
    list.push({ id: n.id, x: n.x, y: n.y, npc: n, topY: n.y + n.top, label: 'talk' });
  }
  if (Quests.content() && Quests.content().id === 'brother' && state.stage === 'search') {
    const th = LANDMARK.treehouse;
    list.push({ id: 'treehouse', x: th.x + 34, y: th.y + 14, topY: th.y - 190, label: 'talk' });
  }
  const L = Quests.logic();
  if (L && L.interactables) L.interactables(list);
  const mr = LANDMARK.mirror;
  list.push({ id: 'mirror', x: mr.x, y: mr.y + 8, topY: mr.y - 90, label: 'look', act: () => Wardrobe.open() });
  if (LANDMARK.myHouse.unlocked) {
    list.push({ id: 'door', x: DOOR.x, y: DOOR.y, topY: DOOR.y - 84, label: 'open', act: () => {
      if (state.finished) Cert.open(); else if (Quests.content() && Quests.content().id === 'final') QUEST_LOGIC.final.open(Quests.content());
    } });
  }
  return list;
}
function nearestInteractable() {
  let best = null, bd = 1e9;
  for (const it of interactables()) {
    const d = Math.hypot(it.x - player.x, (it.y - player.y) * 1.3);
    if (d <= SETTINGS.talkRange && d < bd) { bd = d; best = it; }
  }
  return best;
}
function interact(it) {
  if (!it || game.mode !== 'play') return;
  player.path = null; player.goal = null; player.moving = false;
  if (it.act) { player.dir = faceDir(it.x - player.x, it.y - player.y, player.dir); Talk.hide(); it.act(); return; }
  const n = it.npc || NPC[it.id];
  player.dir = faceDir(it.x - player.x, it.y - player.y, player.dir);
  if (n && n.kind === 'person') n.dir = faceDir(player.x - n.x, (player.y - n.y) * 1.4, n.dir);
  Dialog.partner = n || null;
  Dialog.focus = { id: it.id, x: it.x, y: it.y, top: it.topY };
  Sfx.play('talk');
  if (Quests.talk(it.id)) return;
  const c = GAME_CONTENT.characters[it.id];
  if (c && c.hello) Dialog.show(c.hello.map((s) => [it.id, s]));
}

/* ---- dialog box with karaoke highlighting ---- */
const Dialog = {
  open: false, lines: null, i: 0, done: null, mouth: null, partner: null, focus: null, h: 170, shownAt: 0,
  words: [], offs: [], boundary: false, fbTimer: 0, fbStarted: false, mouthTimer: 0,
  show(lines, done) {
    this.lines = lines.map((l) => (typeof l === 'string' ? [null, l] : l));
    this.i = 0; this.done = done || null; this.open = true;
    setMode('dialog');
    const el = $('dialog');
    el.classList.remove('hidden', 'pop'); void el.offsetWidth; el.classList.add('pop');
    $('talkWrap').classList.add('hidden');
    this.render();
  },
  render() {
    const [who, raw] = this.lines[this.i], text = fillName(raw);
    this.who = who; this.text = text; this.shownAt = performance.now();
    $('dlgName').textContent = who ? charName(who) : '';
    $('dlgName').classList.toggle('hidden', !who);
    drawPortrait($('dlgPortrait'), who || 'sparky');
    const t = $('dlgText'); t.innerHTML = '';
    const box = document.createElement('div');
    this.words = []; this.offs = [];
    let off = 0;
    text.split(' ').forEach((w, i, a) => {
      const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = w; box.appendChild(sp);
      if (i < a.length - 1) box.appendChild(document.createTextNode(' '));
      this.words.push(sp); this.offs.push(off); off += w.length + 1;
    });
    t.appendChild(box);
    const last = this.i === this.lines.length - 1;
    $('dlgNext').textContent = last ? GAME_CONTENT.ui.ok + ' 👍' : GAME_CONTENT.ui.next + ' ▶';
    this.h = $('dialog').offsetHeight + 16;
    this.say();
  },
  say() {
    clearTimeout(this.fbTimer); clearTimeout(this.mouthTimer);
    this.boundary = false; this.fbStarted = false; this.mark(-1);
    const who = this.who, text = this.text, rate = Speech.rate();
    const ok = Speech.speak(text, {
      who: who || 'narrator',
      onStart: () => this.fallback(),
      onBoundary: (ci) => { this.boundary = true; let k = 0; while (k + 1 < this.offs.length && this.offs[k + 1] <= ci) k++; this.mark(k); },
      onEnd: () => { this.mark(this.words.length); this.mouth = null; },
    });
    this.mouth = who;
    const est = text.split(' ').reduce((a, w) => a + (0.12 + w.length * 0.065) / rate, 0.3) * 1000;
    this.mouthTimer = setTimeout(() => { if (this.who === who) this.mouth = null; }, ok ? est * 2 + 2500 : est);
    if (ok) this.fbTimer = setTimeout(() => this.fallback(), 700);
  },
  fallback() {   // no word events from this voice: pace the highlight by estimate
    if (this.fbStarted || this.boundary) return;
    this.fbStarted = true;
    const rate = Speech.rate();
    let i = 0;
    const step = () => {
      if (this.boundary || !this.open || i >= this.words.length) return;
      this.mark(i);
      const dur = (0.12 + this.words[i].textContent.length * 0.065) / rate * 1000;
      i++;
      this.fbTimer = setTimeout(step, dur);
    };
    step();
  },
  mark(k) {

const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
function initInput() {
  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    const k = KEYMAP[e.code];
    if (k) { keys[k] = 1; e.preventDefault(); return; }
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') {
      e.preventDefault();
      if (e.repeat) return;
      if (game.mode === 'dialog') Dialog.next();
      else if (game.mode === 'play' && Talk.it) interact(Talk.it);
      else if (game.mode === 'title') startGame();
      else if (game.mode === 'parent') Parent.start();
      else if (game.mode === 'minigame' && !$('mgNext').classList.contains('hidden')) $('mgNext').click();
    }
    if (e.code === 'Escape') {
      if (game.mode === 'menu') Menu.close();
      else if (game.mode === 'wardrobe') Wardrobe.close();
      else if (game.mode === 'minigame') MG.quit();
    }
  });
  window.addEventListener('keyup', (e) => { const k = KEYMAP[e.code]; if (k) keys[k] = 0; });
  window.addEventListener('blur', () => { keys.up = keys.down = keys.left = keys.right = 0; });
  const cv = $('game');
  const ptr = { down: false, id: -1, last: 0 };
  cv.addEventListener('pointerdown', (e) => {
    if (game.mode !== 'play') return;
    ptr.down = true; ptr.id = e.pointerId; ptr.last = performance.now();
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* old browsers */ }
    tapAt(e.clientX, e.clientY, false);
  });
  cv.addEventListener('pointermove', (e) => {
    if (!ptr.down || e.pointerId !== ptr.id || game.mode !== 'play') return;
    const now = performance.now();
    if (now - ptr.last > 160) { ptr.last = now; tapAt(e.clientX, e.clientY, true); }
  });
  const up = (e) => { if (e.pointerId === ptr.id) ptr.down = false; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  document.addEventListener('contextmenu', (e) => e.preventDefault());
}

    $('parent').classList.add('hidden'); $('creator').classList.add('hidden');
    enterWorld(!state.started);
  },
  step(dt, n = 1) { for (let i = 0; i < n; i++) { update(dt); Fx.update(dt); } this.render(); },
  render() { if (G3.on) g3Render(game.t, 1 / 60); else renderWorld(ctx, cam.x, cam.y, view.pr, view.w, view.h, game.t); Talk.update(); },
  G3, W3, CAM3, setView3,
  tp(x, y) { player.x = x; player.y = y; player.path = null; resetTrail(0, 1); sparky.x = x - 30; sparky.y = y + 14; snapCamera(); },
  overview(k = 0.5) {
    const cv = document.createElement('canvas'); cv.width = W * k; cv.height = H * k;
    renderWorld(cv.getContext('2d'), 0, 0, k, W, H, game.t);
    return cv.toDataURL('image/png');
  },
};
boot();
</script>
</body>
</html>

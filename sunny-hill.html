<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9ddc6e">
<title>Sunny Hill</title>
<style>
:root{
  --ink:#4a3222; --cream:#fffdf6; --sun:#ffc93c; --orange:#ff8c42; --green:#4cc36a; --blue:#4aa3ff; --pink:#ff7aa2;
  --shadow:0 6px 18px rgba(74,50,34,.22);
  --font:"Comic Sans MS","Chalkboard SE","Comic Neue","Trebuchet MS",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ddc6e;font-family:var(--font);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:60}
.hidden{display:none!important}

/* ---------- buttons ---------- */
.btn{font-family:var(--font);font-weight:bold;font-size:22px;min-width:56px;min-height:56px;padding:0 18px;border:0;border-radius:20px;
  color:#fff;background:var(--orange);box-shadow:0 5px 0 rgba(0,0,0,.18),var(--shadow);cursor:pointer;touch-action:manipulation;
  transition:transform .08s ease,box-shadow .08s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1;
  -webkit-appearance:none;appearance:none;outline:none}
.btn:active{transform:translateY(3px) scale(.93);box-shadow:0 2px 0 rgba(0,0,0,.18),var(--shadow)}
.btn:focus-visible{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--blue)}
.btn.round{padding:0;width:56px;border-radius:50%}
.btn.green{background:var(--green)} .btn.blue{background:var(--blue)} .btn.pink{background:var(--pink)}
.btn.yellow{background:var(--sun);color:var(--ink)} .btn.white{background:#fff;color:var(--ink)}
.btn.wide{width:100%;min-height:62px;font-size:24px}
.card{background:var(--cream);border-radius:22px;box-shadow:var(--shadow);border:3px solid #fff}

/* ---------- HUD ---------- */
#questCard{position:fixed;z-index:10;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;padding:5px 8px 5px 5px;max-width:min(440px,calc(100vw - 130px));
  cursor:pointer;min-height:66px;transition:transform .08s}
#questCard:active{transform:scale(.96)}
#qcPortrait{width:56px;height:56px;border-radius:50%;flex:0 0 auto}
#qcText{font-size:20px;font-weight:bold;line-height:1.15}
#qcSpeak{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#topRight{position:fixed;z-index:10;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:10px;align-items:center}
#starBox{font-size:24px;font-weight:bold;padding:0 16px;height:56px;display:flex;align-items:center;gap:6px;white-space:nowrap}
#starBox.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.3)}}
@media (max-width:640px){
  #topRight{flex-direction:column-reverse;align-items:flex-end;gap:8px}
  #starBox{height:46px;font-size:22px;padding:0 12px}
  #qcPortrait{width:48px;height:48px}
  #qcSpeak{position:absolute;left:33px;top:35px;width:30px;height:30px;font-size:15px;border:2px solid #fff}
  #questCard{min-height:58px;gap:8px;max-width:calc(100vw - 150px);padding-right:12px}
  #qcText{line-height:1.08}
}
.row .btn{padding:0 8px;font-size:22px;white-space:nowrap}

/* ---------- talk button ---------- */
#talkWrap{position:fixed;left:0;top:0;z-index:12;will-change:transform}
#talkBtn{position:relative;background:var(--sun);color:var(--ink);font-size:24px;border:4px solid #fff;white-space:nowrap;animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{top:0}50%{top:-7px}}

/* ---------- dialog ---------- */
#dialog{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
  width:min(940px,calc(100vw - 20px));display:flex;align-items:center;gap:14px;padding:12px 14px;
  background:var(--cream);border:4px solid var(--sun);border-radius:28px;box-shadow:0 10px 30px rgba(74,50,34,.3)}
#dialog.pop{animation:dlgPop .22s ease-out}
@keyframes dlgPop{from{opacity:0;margin-bottom:-14px}to{opacity:1;margin-bottom:0}}
#dlgWho{flex:0 0 auto}
#dlgPortrait{display:block;width:88px;height:88px;border-radius:50%;border:4px solid #fff;box-shadow:var(--shadow)}
#dlgMain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
#dlgName{background:var(--orange);color:#fff;font-weight:bold;font-size:20px;padding:2px 12px;border-radius:14px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#dlgText{font-size:clamp(22px,2.6vw,30px);line-height:1.4;font-weight:bold;min-height:2.8em;display:flex;align-items:center}
.w{border-radius:8px;padding:0 2px;transition:background-color .12s,color .12s}
.w.said{color:#e0651a}
.w.now{background:#ffe066;color:var(--ink)}
#dlgBtns{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;align-items:stretch}
#dlgNext{font-size:24px;min-width:128px}
@media (max-width:620px){
  #dialog{flex-wrap:wrap;gap:8px 12px;padding:10px 12px;align-items:flex-start}
  #dlgPortrait{width:60px;height:60px}
  #dlgMain{flex:1 1 0}
  #dlgText{font-size:22px;min-height:0}
  #dlgBtns{flex-direction:row;width:100%;justify-content:flex-end}
  #dlgNext{flex:1 1 auto}
}
@media (max-height:480px) and (orientation:landscape){
  #dialog{padding:8px 12px;width:min(900px,calc(100vw - 20px))}
  #dlgPortrait{width:58px;height:58px}
  #dlgText{font-size:22px;min-height:0}
  #dlgBtns{flex-direction:row}
}

/* ---------- banner (Great job!) ---------- */
#banner{position:fixed;z-index:40;left:50%;top:40%;transform:translate(-50%,-50%);padding:16px 34px;font-size:clamp(34px,7vw,64px);font-weight:bold;color:#fff;
  background:linear-gradient(#ffc23c,#ff8c42);border:6px solid #fff;border-radius:34px;box-shadow:0 12px 30px rgba(0,0,0,.25);
  text-shadow:0 3px 0 rgba(0,0,0,.18);white-space:nowrap;pointer-events:none;animation:bannerIn .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes bannerIn{from{transform:translate(-50%,-50%) scale(.2);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.flyStar{position:fixed;z-index:45;font-size:64px;pointer-events:none;transition:transform .9s cubic-bezier(.5,-0.3,.7,1),opacity .9s}

/* ---------- overlays (title, menu) ---------- */
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,28,18,.45);overflow:auto}
.panel{width:min(420px,100%);padding:20px;display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.panel h2{margin:0 0 4px;font-size:30px}
.panel p{margin:0;font-size:22px}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.btn.sel{background:var(--green);box-shadow:0 0 0 4px #fff inset,0 5px 0 rgba(0,0,0,.18)}
.btn.unsel{background:#c9bfb4}
#title{background:linear-gradient(#7fd3ff 0%,#bdeaff 55%,#9ddc6e 55.1%,#86cf5c 100%);z-index:35}
#titleBox{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
#titleBox h1{margin:0;font-size:clamp(52px,12vw,96px);color:#fff;letter-spacing:1px;
  text-shadow:0 5px 0 #ff8c42,0 9px 0 rgba(0,0,0,.15);-webkit-text-stroke:3px var(--ink)}
.sunBall{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fff3a0,#ffc93c 60%,#ffa928);
  border:5px solid var(--ink);box-shadow:0 0 0 14px rgba(255,220,90,.45),0 0 0 28px rgba(255,220,90,.2)}
#startBtn{font-size:34px;min-height:78px;padding:0 44px;border-radius:28px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="questCard" class="card hidden" role="button" aria-label="Quest">
  <canvas id="qcPortrait" width="112" height="112"></canvas>
  <div id="qcText"></div>
  <div id="qcSpeak" aria-hidden="true">🔊</div>
</div>
<div id="topRight" class="hidden">
  <div id="starBox" class="card">⭐ <span id="starCount">0</span>/<span id="starTotal">8</span></div>
  <button id="menuBtn" class="btn round white" aria-label="Menu">⚙️</button>
</div>

<div id="talkWrap" class="hidden"><button id="talkBtn" class="btn">Talk 💬</button></div>

<div id="dialog" class="hidden">
  <div id="dlgWho"><canvas id="dlgPortrait" width="176" height="176"></canvas></div>
  <div id="dlgMain"><div id="dlgName"></div><div id="dlgText"></div></div>
  <div id="dlgBtns">
    <button id="dlgSpeak" class="btn round blue" aria-label="Listen again">🔊</button>
    <button id="dlgNext" class="btn green">Next ▶</button>
  </div>
</div>

<div id="banner" class="hidden"></div>

<div id="menu" class="overlay hidden">
  <div id="menuMain" class="panel card">
    <h2 id="mTitle">Menu</h2>
    <button id="mSound" class="btn blue wide"></button>
    <div class="row"><button id="mSlow" class="btn wide"></button><button id="mNormal" class="btn wide"></button></div>
    <button id="mRestart" class="btn pink wide"></button>
    <button id="mClose" class="btn green wide"></button>
  </div>
  <div id="menuAsk" class="panel card hidden">
    <p id="askText"></p>
    <div class="row"><button id="askYes" class="btn pink wide"></button><button id="askNo" class="btn green wide"></button></div>
  </div>
</div>

<div id="title" class="overlay">
  <div id="titleBox">
    <div class="sunBall"></div>
    <h1 id="titleText">Sunny Hill</h1>
    <button id="startBtn" class="btn yellow">Start ▶</button>
  </div>
</div>

<canvas id="fx"></canvas>

<script>
'use strict';
/* ==========================================================================
   SUNNY HILL — 2. sınıf İngilizce RPG · Unit 1: What is a family?
   Tek dosya, internetsiz çalışır. Bölümler (sırasıyla):
   AYARLAR · İÇERİK · ÇİZİM · OYUNCU · HARİTA · NPC'LER · GÖREVLER ·
   MİNİ OYUNLAR · ARAYÜZ · SES · KAYIT · ANA DÖNGÜ
   ========================================================================== */

/* ============================== AYARLAR ============================== */
const SETTINGS = {
  worldW: 1600, worldH: 1200,   // world size in world units
  viewSize: 540,                // world units visible along the shorter screen side
  minScale: 0.55, maxScale: 1.8,
  maxDpr: 2,                    // cap devicePixelRatio for old tablets
  walkSpeed: 170,
  talkRange: 80,
  saveKey: 'sunnyHill.save.v1',
  totalStars: 8,
  rateSlow: 0.85, rateNormal: 1.0,
};

/* ============================== İÇERİK ============================== */
/*  ÖĞRETMEN İÇİN:
    Oyundaki bütün İngilizce metinler bu GAME_CONTENT nesnesinin içinde.
    - Tırnak içindeki metinleri değiştirebilirsiniz.
    - ['milo', 'Hi!'] gibi satırlarda ilk kısım konuşan karakter, ikinci kısım cümledir.
    - {name} yazan yere çocuğun adı gelir.
    - Tırnakları, köşeli parantezleri ve virgülleri silmeyin.                */
const GAME_CONTENT = {
  title: 'Sunny Hill',
  defaultName: 'Explorer',

  ui: {
    start: 'Start', talk: 'Talk', next: 'Next', ok: 'OK',
    greatJob: 'Great job!', tryAgain: 'Try again!',
    menu: 'Menu', sound: 'Sound', on: 'On', off: 'Off',
    slow: 'Slow', normal: 'Normal', restart: 'Restart game', close: 'Close',
    restartAsk: 'Start again? / Baştan başlansın mı?', yes: 'Yes', no: 'No',
    freeWalk: 'Walk around Sunny Hill!',
  },

  // Oyunun başında Sparky'nin söyledikleri
  intro: [
    ['sparky', "Woof! I'm Sparky. I'm your dog!"],
    ['sparky', 'Welcome to Sunny Hill!'],
    ['sparky', "Let's go and say hello to Milo!"],
  ],
  welcomeBack: [['sparky', 'Woof! Welcome back!']],

  // Tabelalar
  signs: {
    village: 'Sunny Hill', milo: "Milo's House", apartment: 'Apartment', farm: 'Farm',
    tent: 'Tent', houseboat: 'Houseboat', cottage: 'Cottage', myHouse: 'My House',
  },

  // Karakter adları ve normal selamlaşma cümleleri
  characters: {
    player: { name: '{name}' },
    sparky: { name: 'Sparky', hello: ['Woof woof!'] },
    milo:   { name: 'Milo',  hello: ["Hi! I'm Milo.", 'Leo is my brother.'] },
    leo:    { name: 'Leo',   hello: ["Hi! I'm Leo.", 'Milo is my brother.'] },
    mom:    { name: "Milo's Mom", hello: ["Hello! I'm Milo's mother."] },
    dad:    { name: "Milo's Dad", hello: ["Hi! I'm Milo's father."] },
    rosa:   { name: 'Granny Rosa', hello: ["Hello, dear! I'm Granny Rosa.", 'I live in an apartment.'] },
    nomi:   { name: 'Nomi', hello: ["Hi! I'm Nomi.", 'I live in a tent.'] },
    bob:    { name: 'Captain Bob', hello: ["Ahoy! I'm Captain Bob.", 'I live in a houseboat.'] },
    max:    { name: 'Uncle Max', hello: ["Hello! I'm Uncle Max.", 'This is my farm.'] },
    lily:   { name: 'Aunt Lily', hello: ["Hi! I'm Aunt Lily.", 'Pip and Pop are my children.'] },
    pip:    { name: 'Pip', hello: ["Hi! I'm Pip.", 'Pop is my brother.'] },
    pop:    { name: 'Pop', hello: ["Hi! I'm Pop.", 'Pip is my sister.'] },
    owl:    { name: 'Mr. Owl', hello: ["Hoo hoo! I'm Mr. Owl.", 'I live in a cottage.'] },
  },

  // Görevler (sırayla açılır)
  quests: [
    { // ---------------- Görev 1 ----------------
      id: 'brother',
      title: 'Find my brother!',
      cardStart: 'Talk to Milo!',
      card: "Find Milo's brother, Leo!",
      cardFound: 'Take Leo to Milo!',
      intro: [
        ['milo', "Hi! I'm Milo. This is my house."],
        ['milo', 'My brother Leo is lost!'],
        ['milo', 'Can you find my brother?'],
        ['sparky', "Woof! Let's find Leo!"],
      ],
      reminder: [['milo', 'Where is my brother Leo?']],
      // Yanlış çocuklar (köyde dolaşırlar)
      wrongKids: {
        pip:  [['pip', "No, I'm not Leo. I'm Pip!"]],
        pop:  [['pop', "No, I'm not Leo. I'm Pop."], ['pop', "I'm not Milo's brother. I'm his cousin!"]],
        nomi: [['nomi', "No, I'm not Leo. I'm Nomi!"], ['nomi', 'I live in a tent.']],
      },
      // İki yanlış çocuktan sonra Sparky ipucu verir
      hint: [['sparky', "Woof! Leo isn't here."], ['sparky', "Let's look in the backyard!"]],
      // Ağaç evde Leo bulununca
      found: [['leo', "Yes! I'm Leo. Milo is my brother!"], ['leo', "Let's go to Milo!"]],
      finish: [
        ['milo', 'Leo! Thank you, {name}!'],
        ['leo', 'Milo is my brother. I love my family!'],
        ['milo', 'Granny Rosa is my grandmother!'],
      ],
    },
  ],
};

/* ============================== ÇİZİM ============================== */
const W = SETTINGS.worldW, H = SETTINGS.worldH;
const TAU = Math.PI * 2;
const INK = '#4a3222';
const FONT = '"Comic Sans MS","Chalkboard SE","Comic Neue","Trebuchet MS",sans-serif';

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) { // deterministic, so the village looks the same every time
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0; let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shade(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (a < 0) { r *= 1 + a; g *= 1 + a; b *= 1 + a; } else { r += (255 - r) * a; g += (255 - g) * a; b += (255 - b) * a; }
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}

/* ---- primitives ---- */
function rrPath(c, x, y, w, h, r) {
  if (w < 0) { x += w; w = -w; } if (h < 0) { y += h; h = -h; }
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function paint(c, fill, lw) {
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (lw) { c.lineWidth = lw; c.strokeStyle = INK; c.stroke(); }
}
function rrect(c, x, y, w, h, r, fill, lw = 3) { c.beginPath(); rrPath(c, x, y, w, h, r); paint(c, fill, lw); }
function circ(c, x, y, r, fill, lw = 3) { c.beginPath(); c.arc(x, y, r, 0, TAU); paint(c, fill, lw); }
function ell(c, x, y, rx, ry, fill, lw = 3, rot = 0) { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); paint(c, fill, lw); }
function poly(c, pts, fill, lw = 3) {
  c.beginPath(); c.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
  c.closePath(); paint(c, fill, lw);
}
function seg(c, x0, y0, x1, y1, col, lw) { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.strokeStyle = col; c.lineWidth = lw; c.stroke(); }
function shadowE(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fillStyle = 'rgba(70,50,20,.2)'; c.fill(); }
function starPath(c, x, y, r, rot) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot - Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.5 : r;
    c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  c.closePath();
}
/* Blobs drawn "all outlines first, then all fills" merge into one outlined shape. */
function blobs(c, list, fill, lw) {
  c.lineWidth = lw * 2; c.strokeStyle = INK;
  for (const b of list) { c.beginPath(); c.arc(b[0], b[1], b[2], 0, TAU); c.stroke(); }
  c.fillStyle = fill;
  for (const b of list) { c.beginPath(); c.arc(b[0], b[1], b[2], 0, TAU); c.fill(); }
}

/* ---- sprite cache: static art is drawn once per zoom level ---- */
const SPRITES = {};
function defSprite(key, b, fn) { SPRITES[key] = { b, fn }; }
const SPR = {
  pr: 1, cache: new Map(),
  reset(pr) { this.pr = pr; this.cache.clear(); },
  get(key) {
    let cv = this.cache.get(key);
    if (cv) return cv;
    const d = SPRITES[key], b = d.b, pr = this.pr;
    cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.ceil((b[2] - b[0]) * pr));
    cv.height = Math.max(1, Math.ceil((b[3] - b[1]) * pr));
    const g = cv.getContext('2d');
    g.scale(pr, pr); g.translate(-b[0], -b[1]);
    g.lineJoin = 'round'; g.lineCap = 'round';
    d.fn(g);
    this.cache.set(key, cv);
    return cv;
  },
  draw(c, key, x, y, skew) {
    const cv = this.get(key), b = SPRITES[key].b;
    if (skew) {
      c.save(); c.translate(x, y); c.transform(1, 0, skew, 1, 0, 0);
      c.drawImage(cv, b[0], b[1], b[2] - b[0], b[3] - b[1]); c.restore();
    } else c.drawImage(cv, x + b[0], y + b[1], b[2] - b[0], b[3] - b[1]);
  },
};

/* ---- people ---- */
function personDims(L) {
  const A = L.age === 'adult';
  return { A, legH: A ? 16 : 11, bodyH: A ? 27 : 20, hr: A ? 18 : 19, bw: A ? 15 : 13 };
}
function personHeadY(L) { const d = personDims(L); return -d.legH - 2 - d.bodyH - d.hr + 6; }
function personTop(L) { const d = personDims(L); return (personHeadY(L) - d.hr - 4 - (L.hat ? 9 : 0)) * (L.size || 1); }

function legP(c, x, hipY, col, shoe, lift, dark, topCol) {
  const y1 = -3 - lift;
  rrect(c, x - 3.8, hipY - 3, 7.6, y1 - hipY + 3, 3.8, dark ? shade(col, -0.18) : col, 2.5);
  if (topCol) rrect(c, x - 4.6, hipY - 3, 9.2, (y1 - hipY) * 0.42 + 3, 3.5, dark ? shade(topCol, -0.18) : topCol, 2.5);
  ell(c, x + 0.8, y1 + 0.3, 5.4, 3.5, shoe, 2.5);
}
function armP(c, x, y, ang, len, sleeve, skin) {
  c.save(); c.translate(x, y); c.rotate(ang);
  rrect(c, -3.7, -2, 7.4, len, 3.7, skin, 2.5);
  rrect(c, -4.5, -3.5, 9, len * 0.46, 4.2, sleeve, 2.5);
  circ(c, 0, len, 4.3, skin, 2.5);
  c.restore();

const COLL = { cs: 5, cols: W / 5, rows: H / 5, g: null };

    else if (s.t === 'c') { x0 = s.x - s.r; y0 = s.y - s.r; x1 = s.x + s.r; y1 = s.y + s.r; }

function updateAnimals(dt) {

function followPath(n, dt, speed) {
  const p = n.path[n.pathI];
  if (!p) { n.path = null; n.moving = false; return; }
  const dx = p.x - n.x, dy = p.y - n.y, d = Math.hypot(dx, dy);
  if (d < 4) { n.pathI++; if (n.pathI >= n.path.length) { n.path = null; n.moving = false; if (n.onArrive) { const f = n.onArrive; n.onArrive = null; f(); } } return; }
  const s = Math.min(d, speed * dt), ox = n.x, oy = n.y;
  moveBody(n, dx / d * s, dy / d * s, PR_FEET);
  const moved = Math.hypot(n.x - ox, n.y - oy);
  n.moving = moved > 0.1; n.phase += moved * 0.09; n.dir = faceDir(dx, dy, n.dir);

function updateNPCs(dt) {

    if (n.path && (play || !n.wander) && !(n.wander && near)) { followPath(n, dt, n.wander ? n.speed : 90); continue; }
    n.moving = false;
    if (near || dp < 150) { n.dir = faceDir(player.x - n.x, (player.y - n.y) * 1.4, n.dir); continue; }
    if (n.wander && play && (n.wait -= dt) < 0) {

const QUEST_LOGIC = {};

QUEST_LOGIC.brother = {          // Görev 1 — Find my brother!
  givers: ['milo'],
  decoys: ['pip', 'pop', 'nomi'],
  talk(id, C) {
    const q = state.q;
    if (id === 'milo') {
      if (state.stage === 'available') { Dialog.show(C.intro, () => { state.stage = 'search'; state.q = { met: [] }; saveAndRefresh(); }); return true; }
      if (state.stage === 'search') { Dialog.show(C.reminder); return true; }
      if (state.stage === 'return') {
        Dialog.show(C.finish, () => {
          const leo = NPC.leo; leo.follow = 0;
          leo.path = findPath(leo.x, leo.y, leo.home.x, leo.home.y); leo.pathI = 0; leo.onArrive = () => { leo.dir = 'down'; };
          Quests.complete();
        });
        return true;
      }
    }
    if (state.stage === 'search' && C.wrongKids[id]) {
      Dialog.show(C.wrongKids[id], () => {
        if (q.met.indexOf(id) < 0) q.met.push(id);
        if (q.met.length >= 2 && !q.hinted) { q.hinted = true; saveAndRefresh(); Dialog.show(C.hint); }
        else saveAndRefresh();
      });
      return true;
    }
    if (id === 'treehouse' && state.stage === 'search') {
      Dialog.show(C.found, () => {
        state.stage = 'return';
        const leo = NPC.leo, th = LANDMARK.treehouse;
        leo.hidden = false; leo.x = th.x + 34; leo.y = th.y + 26; leo.follow = 76;
        saveAndRefresh();
      });
      return true;
    }
    return false;
  },
  marker(id) {
    if (state.stage !== 'search') return null;
    if (this.decoys.indexOf(id) >= 0 && state.q.met.indexOf(id) < 0) return '?';
    if (id === 'treehouse' && state.q.hinted) return '?';
    return null;
  },
  target() {
    if (state.stage === 'search') {
      if (state.q.hinted) return LANDMARK.treehouse;
      let best = null, bd = 1e9;
      for (const id of this.decoys) {
        if (state.q.met.indexOf(id) >= 0) continue;
        const n = NPC[id], d = Math.hypot(n.x - player.x, n.y - player.y);
        if (d < bd) { bd = d; best = n; }
      }
      return best || LANDMARK.treehouse;
    }
    return NPC.milo;
  },
  card(C) {
    if (state.stage === 'search') return ['milo', C.card];
    if (state.stage === 'return') return ['leo', C.cardFound];
    return ['milo', C.cardStart];
  },
};

const Quests = {
  content(i = state.quest) { return GAME_CONTENT.quests[i] || null; },
  logic(i = state.quest) { const c = this.content(i); return c ? QUEST_LOGIC[c.id] || null : null; },
  talk(id) { const L = this.logic(); return !!(L && L.talk(id, this.content())); },
  marker(id) {
    const L = this.logic();
    if (L) {
      const m = L.marker ? L.marker(id) : null;
      if (m) return m;
      if (L.givers.indexOf(id) >= 0) return state.stage === 'available' ? '!' : '...';
    }
    for (let i = 0; i < state.quest; i++) { const Li = this.logic(i); if (Li && Li.givers.indexOf(id) >= 0) return 'star'; }
    return null;
  },
  target() {
    const L = this.logic();
    if (!L) return null;
    return L.target ? L.target() : NPC[L.givers[0]];
  },
  card() {
    const L = this.logic(), C = this.content();
    if (!L) return ['sparky', GAME_CONTENT.ui.freeWalk];
    return L.card(C);
  },
  leoHiding() { const C = this.content(); return !!C && C.id === 'brother' && state.stage !== 'return'; },
  complete() {
    const C = this.content();
    if (state.done.indexOf(C.id) < 0) state.done.push(C.id);
    state.stars = Math.min(SETTINGS.totalStars, state.stars + 1);

  },

/* Places everyone according to the saved progress. instant = on load. */
function applyWorldState(instant) {
  const q1 = state.done.indexOf('brother') >= 0;
  const leo = NPC.leo;
  if (q1) { leo.hidden = false; if (instant) sendHome(leo, true); }
  else if (state.quest === 0 && state.stage === 'return') {
    leo.hidden = false; leo.follow = 76; leo.x = player.x - 20; leo.y = player.y + 24;
  } else leo.hidden = true;
  const R = rng(99);
  for (const id of ['pip', 'pop', 'nomi']) {
    const n = NPC[id];
    if (!q1) {
      n.wander = MAP.wander; n.speed = id === 'nomi' ? 55 : 64;
      if (instant) { const p = randomFreePoint(MAP.wander, R); if (p) { n.x = p.x; n.y = p.y; } }
    } else sendHome(n, instant);
  }
  LANDMARK.myHouse.unlocked = state.quest >= GAME_CONTENT.quests.length && GAME_CONTENT.quests.length >= 8;
}

function interactables() {
  const list = [];

    if (n.hidden || n.follow) continue;
    list.push({ id: n.id, x: n.x, y: n.y, npc: n, topY: n.y + n.top });
  }
  if (Quests.content() && Quests.content().id === 'brother' && state.stage === 'search') {

    list.push({ id: 'treehouse', x: th.x + 34, y: th.y + 14, topY: th.y - 190 });
  }
  return list;
}
function nearestInteractable() {
  let best = null, bd = 1e9;
  for (const it of interactables()) {
    const d = Math.hypot(it.x - player.x, (it.y - player.y) * 1.3);
    if (d <= SETTINGS.talkRange && d < bd) { bd = d; best = it; }
  }
  return best;
}
function interact(it) {
  if (!it || game.mode !== 'play') return;

  const n = it.npc || NPC[it.id];
  player.dir = faceDir(it.x - player.x, it.y - player.y, player.dir);

/* ---- dialog box with karaoke highlighting ---- */
const Dialog = {
  open: false, lines: null, i: 0, done: null, mouth: null, partner: null, focus: null, h: 170, shownAt: 0,
  words: [], offs: [], boundary: false, fbTimer: 0, fbStarted: false, mouthTimer: 0,
  show(lines, done) {
    this.lines = lines.map((l) => (typeof l === 'string' ? [null, l] : l));
    this.i = 0; this.done = done || null; this.open = true;
    setMode('dialog');
    const el = $('dialog');
    el.classList.remove('hidden', 'pop'); void el.offsetWidth; el.classList.add('pop');
    $('talkWrap').classList.add('hidden');
    this.render();
  },
  render() {
    const [who, raw] = this.lines[this.i], text = fillName(raw);
    this.who = who; this.text = text; this.shownAt = performance.now();
    $('dlgName').textContent = who ? charName(who) : '';
    $('dlgName').classList.toggle('hidden', !who);
    drawPortrait($('dlgPortrait'), who || 'sparky');
    const t = $('dlgText'); t.innerHTML = '';
    const box = document.createElement('div');
    this.words = []; this.offs = [];
    let off = 0;
    text.split(' ').forEach((w, i, a) => {
      const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = w; box.appendChild(sp);
      if (i < a.length - 1) box.appendChild(document.createTextNode(' '));
      this.words.push(sp); this.offs.push(off); off += w.length + 1;
    });
    t.appendChild(box);
    const last = this.i === this.lines.length - 1;
    $('dlgNext').textContent = last ? GAME_CONTENT.ui.ok + ' 👍' : GAME_CONTENT.ui.next + ' ▶';
    this.h = $('dialog').offsetHeight + 16;
    this.say();
  },
  say() {
    clearTimeout(this.fbTimer); clearTimeout(this.mouthTimer);
    this.boundary = false; this.fbStarted = false; this.mark(-1);
    const who = this.who, text = this.text, rate = Speech.rate();
    const ok = Speech.speak(text, {
      pitch: VOICE[who] || 1,
      onStart: () => this.fallback(),
      onBoundary: (ci) => { this.boundary = true; let k = 0; while (k + 1 < this.offs.length && this.offs[k + 1] <= ci) k++; this.mark(k); },
      onEnd: () => { this.mark(this.words.length); this.mouth = null; },
    });

  if (pi >= 0) {   // see-through player when a building or tree is in front
    const px0 = player.x - 16, px1 = player.x + 16, py0 = player.y - 70, py1 = player.y;
    for (let i = pi + 1; i < L.length; i++) {
      const o = L[i];
      if (o.occ && o.x + o.b[0] < px1 && o.x + o.b[2] > px0 && o.y + o.b[1] < py1 && o.y + o.b[3] > py0) {
        c.globalAlpha = 0.45; player.draw(c, t); c.globalAlpha = 1; break;
      }
    }
  }
  drawButterflies(c, t, cx, cy, vw, vh);
  // markers above heads
  const talkId = Talk.it ? Talk.it.id : Dialog.focus ? Dialog.focus.id : null;
  for (const n of NPCS) {
    if (n.hidden || n.follow || n.id === talkId) continue;
    const mk = markerFor(n);
    if (mk && n.x > vx0 && n.x < vx1 && n.y + n.top > vy0 - 40 && n.y < vy1 + 80) drawMarker(c, n.x, n.y + n.top - 22, mk, t);
  }
  const thm = Quests.logic() && Quests.logic().marker ? Quests.logic().marker('treehouse') : null;
  if (thm && talkId !== 'treehouse') drawMarker(c, LANDMARK.treehouse.x, LANDMARK.treehouse.y - 200, thm, t);
  // Sparky points at the current goal
  const tg = game.mode === 'play' ? Quests.target() : null;
  if (tg) {
    const tx = tg.x, ty = tg.y, d = Math.hypot(tx - player.x, ty - player.y);
    if (d > 130) drawGuideArrow(c, sparky.x, sparky.y - 62, Math.atan2(ty - sparky.y, tx - sparky.x), t);
  }
}
function update(dt) {
  game.t += dt;
  updatePlayer(dt);
  updateFollower(sparky, 40, dt);
  if (!sparky.moving && game.mode === 'play' && !player.moving) sparky.face = player.x < sparky.x ? -1 : 1;
  updateNPCs(dt);
  updateAnimals(dt);
  updateCamera(dt, false);
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  if (game.paused) return;
  Fx.update(dt);
  if (game.mode === 'title') return;
  update(dt);
  const pr = view.pr;
  const cx = Math.round(cam.x * pr) / pr, cy = Math.round(cam.y * pr) / pr;
  renderWorld(ctx, cx, cy, pr, view.w, view.h, game.t);
  Talk.update();
}
function snapCamera() { updateCamera(0, true); }
function startGame() {
  if (game.mode !== 'title') return;
  Sfx.unlock();
  $('title').classList.add('hidden');
  $('questCard').classList.remove('hidden');
  $('topRight').classList.remove('hidden');
  setMode('play');
  Hud.refresh();
  if (!state.started) { state.started = true; Save.save(); Dialog.show(GAME_CONTENT.intro); }
  else Dialog.show(GAME_CONTENT.welcomeBack);
}
function boot() {
  canvas = $('game'); ctx = canvas.getContext('2d');
  Save.load();
  refreshPlayerLook();
  defineSprites();
  initMap();
  buildCollision();
  buildNav();
  initWaves();
  initButterflies();
  initEntities();
  player.x = MAP.start.x; player.y = MAP.start.y; player.dir = 'up';
  resetTrail(0.4, 1);
  sparky.x = player.x - 30; sparky.y = player.y + 14;
  applyWorldState(true);
  UI.init();
  initInput();
  resize();
  let rt = 0;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 120); });
  window.addEventListener('orientationchange', () => { clearTimeout(rt); rt = setTimeout(resize, 250); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) Speech.stop(); last = performance.now(); });
  Hud.refresh();
  requestAnimationFrame(frame);
}

/* Developer hook used by the automated checks (tools). Harmless for players. */
window.SH = {
  get state() { return state; }, player, sparky, NPC, Quests, Dialog, Speech, Save, cam, view, game, keys,
  findPath, circleFree, interactables, nearestInteractable, interact, startGame, tapAt, walkTo, LANDMARK,
  step(dt, n = 1) { for (let i = 0; i < n; i++) { update(dt); Fx.update(dt); } this.render(); },
  render() { const pr = view.pr; renderWorld(ctx, cam.x, cam.y, pr, view.w, view.h, game.t); Talk.update(); },
  tp(x, y) { player.x = x; player.y = y; player.path = null; resetTrail(0, 1); sparky.x = x - 30; sparky.y = y + 14; snapCamera(); },
  overview(k = 0.5) {
    const cv = document.createElement('canvas'); cv.width = W * k; cv.height = H * k;
    renderWorld(cv.getContext('2d'), 0, 0, k, W, H, game.t);
    return cv.toDataURL('image/png');
  },
};
boot();
</script>

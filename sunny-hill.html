<style>
:root{
  --ink:#4a3222; --cream:#fffdf6; --sun:#ffc93c; --orange:#ff8c42; --green:#4cc36a; --blue:#4aa3ff; --pink:#ff7aa2;
  --shadow:0 6px 18px rgba(74,50,34,.22);
  --font:"M PLUS Rounded 1c","Comic Sans MS","Chalkboard SE","Comic Neue","Trebuchet MS",sans-serif;
  --logo:"Fredoka","M PLUS Rounded 1c","Comic Sans MS","Chalkboard SE",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ddc6e;font-family:var(--font);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:none}
body.g3 #gl{display:block}
#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:60}
.hidden{display:none!important}
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;transition:opacity .45s;
  background:linear-gradient(#8fd6ff,#dff4ff 58%,#a8e07a 58.2%,#6cc45a)}
#splash.gone{opacity:0;pointer-events:none}
.spBox{display:flex;flex-direction:column;align-items:center;gap:6px}
.spSun{font-size:72px;line-height:1;animation:spin 6s linear infinite}
.spTitle{font-family:"Fredoka","Comic Sans MS","Chalkboard SE",sans-serif;font-weight:700;font-size:clamp(48px,12vw,92px);line-height:1.1;color:#ffe066;
  -webkit-text-stroke:5px #5a2f14;paint-order:stroke fill;text-shadow:0 5px 0 #ff9f2b,0 9px 0 #5a2f14,0 16px 20px rgba(0,0,0,.3)}
.spDots{display:flex;gap:12px;margin-top:18px}
.spDots i{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15);animation:spDot 1s ease-in-out infinite}
.spDots i:nth-child(2){animation-delay:.15s} .spDots i:nth-child(3){animation-delay:.3s}
@keyframes spDot{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}

/* ---------- buttons ---------- */
.btn{font-family:var(--font);font-weight:bold;font-size:22px;min-width:56px;min-height:56px;padding:0 18px;border:0;border-radius:20px;
  color:#fff;background:var(--orange);box-shadow:0 5px 0 rgba(0,0,0,.18),var(--shadow);cursor:pointer;touch-action:manipulation;
  transition:transform .08s ease,box-shadow .08s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1;
  -webkit-appearance:none;appearance:none;outline:none}
.btn:active{transform:translateY(3px) scale(.93);box-shadow:0 2px 0 rgba(0,0,0,.18),var(--shadow)}
.btn:focus-visible{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--blue)}
.btn.round{padding:0;width:56px;border-radius:50%}
.btn.green{background:var(--green)} .btn.blue{background:var(--blue)} .btn.pink{background:var(--pink)}
.btn.yellow{background:var(--sun);color:var(--ink)} .btn.white{background:#fff;color:var(--ink)}
.btn.wide{width:100%;min-height:62px;font-size:24px}
.card{background:var(--cream);border-radius:22px;box-shadow:var(--shadow);border:3px solid #fff}

/* ---------- HUD ---------- */
#questCard{position:fixed;z-index:10;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;padding:5px 8px 5px 5px;max-width:min(440px,calc(100vw - 130px));
  cursor:pointer;min-height:66px;transition:transform .08s}
#questCard:active{transform:scale(.96)}
#qcPortrait{width:56px;height:56px;border-radius:50%;flex:0 0 auto}
#qcText{font-size:20px;font-weight:bold;line-height:1.15}
#qcSpeak{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#topRight{position:fixed;z-index:10;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:10px;align-items:center}
#starBox{font-size:24px;font-weight:bold;padding:0 16px;height:56px;display:flex;align-items:center;gap:6px;white-space:nowrap}
#starBox.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.3)}}
@media (max-width:640px){
  #topRight{flex-direction:column-reverse;align-items:flex-end;gap:8px}
  #starBox{height:46px;font-size:22px;padding:0 12px}
  #qcPortrait{width:48px;height:48px}
  #qcSpeak{position:absolute;left:33px;top:35px;width:30px;height:30px;font-size:15px;border:2px solid #fff}
  #questCard{min-height:58px;gap:8px;max-width:calc(100vw - 150px);padding-right:12px}
  #qcText{line-height:1.08}
}
.row .btn{padding:0 8px;font-size:22px;white-space:nowrap}

/* ---------- talk button ---------- */
#talkWrap{position:fixed;left:0;top:0;z-index:12;will-change:transform}
#talkBtn{position:relative;background:var(--sun);color:var(--ink);font-size:24px;border:4px solid #fff;white-space:nowrap;animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{top:0}50%{top:-7px}}
#talkWrap.mini{pointer-events:none}
#talkWrap.mini #talkBtn{width:56px;padding:0;border-radius:50%;font-size:28px}

/* ---------- phone / tablet controls: joystick bottom-left, action button bottom-right ---------- */
:root{--joy:136px;--knob:62px;--act:112px}
body.dev-tablet{--joy:168px;--knob:74px;--act:132px}
#joyZone{position:fixed;left:0;bottom:0;z-index:11;width:min(48vw,420px);height:min(60vh,440px);touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;padding-left:env(safe-area-inset-left);padding-bottom:env(safe-area-inset-bottom);box-sizing:border-box}
#joyBase{position:absolute;left:0;top:0;width:var(--joy);height:var(--joy);margin:calc(var(--joy) / -2) 0 0 calc(var(--joy) / -2);border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.18) 0 38%,rgba(255,255,255,.34) 39% 62%,rgba(255,255,255,.2) 63%);
  border:4px solid rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(0,0,0,.25),inset 0 0 0 3px rgba(74,50,34,.12);opacity:.8;transition:opacity .15s}
#joyBase::before,#joyBase::after{content:'';position:absolute;left:50%;top:50%;width:0;height:0;border:9px solid transparent;opacity:.75}
#joyBase::before{border-bottom:11px solid #fff;transform:translate(-50%,calc(var(--joy) / -2 + 2px))}
#joyBase::after{border-top:11px solid #fff;transform:translate(-50%,calc(var(--joy) / 2 - 24px))}
#joyZone.held #joyBase{opacity:1}
#joyKnob{position:absolute;left:50%;top:50%;width:var(--knob);height:var(--knob);margin:calc(var(--knob) / -2) 0 0 calc(var(--knob) / -2);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffffff,#ffe9a8 38%,#ffc93c 75%);border:4px solid #fff;box-shadow:0 5px 0 #d9962b,0 9px 16px rgba(0,0,0,.3)}
#joyZone.joyHint:not(.held) #joyKnob{animation:knobHint 2.2s ease-in-out infinite}
@keyframes knobHint{0%,100%{transform:translate(0,0)}20%{transform:translate(-18px,0)}45%{transform:translate(18px,0)}70%{transform:translate(0,-18px)}}
#actBtn{position:fixed;z-index:11;right:calc(20px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:var(--act);height:var(--act);
  border-radius:50%;border:5px solid #fff;padding:0;background:radial-gradient(circle at 35% 28%,#fff6c4,#ffd23c 45%,#ffb300);
  box-shadow:0 7px 0 #c98a12,0 12px 22px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  font-family:var(--font);font-weight:bold;color:var(--ink);cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;outline:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:filter .15s,opacity .15s}
#actBtn .ai{font-size:calc(var(--act) * .36);line-height:1.05;pointer-events:none}
#actBtn .al{font-size:20px;line-height:1.1;pointer-events:none}
#actBtn.off{filter:saturate(.2) brightness(1.05);opacity:.62}
#actBtn.ready{animation:actPulse 1.1s ease-in-out infinite}
#actBtn:active,#actBtn.down{transform:translateY(5px) scale(.96);box-shadow:0 2px 0 #c98a12,0 5px 10px rgba(0,0,0,.25);animation:none}
#actBtn.nope{animation:nope .35s}
@keyframes actPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes nope{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}

/* ---------- dialog ---------- */
#dialog{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
  width:min(940px,calc(100vw - 20px));display:flex;align-items:center;gap:14px;padding:12px 14px;
  background:var(--cream);border:4px solid var(--sun);border-radius:28px;box-shadow:0 10px 30px rgba(74,50,34,.3)}
#dialog.pop{animation:dlgPop .22s ease-out}
@keyframes dlgPop{from{opacity:0;margin-bottom:-14px}to{opacity:1;margin-bottom:0}}
#dlgWho{flex:0 0 auto}
#dlgPortrait{display:block;width:88px;height:88px;border-radius:50%;border:4px solid #fff;box-shadow:var(--shadow)}
#dlgMain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
#dlgName{background:var(--orange);color:#fff;font-weight:bold;font-size:20px;padding:2px 12px;border-radius:14px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#dlgText{font-size:clamp(22px,2.6vw,30px);line-height:1.4;font-weight:bold;min-height:2.8em;display:flex;align-items:center}
.w{border-radius:8px;padding:0 2px;transition:background-color .12s,color .12s}
.w.said{color:#e0651a}
.w.now{background:#ffe066;color:var(--ink)}
#dlgBtns{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;align-items:stretch}
#dlgNext{font-size:24px;min-width:128px}
@media (max-width:620px){
  #dialog{flex-wrap:wrap;gap:8px 12px;padding:10px 12px;align-items:flex-start}
  #dlgPortrait{width:60px;height:60px}
  #dlgMain{flex:1 1 0}
  #dlgText{font-size:22px;min-height:0}
  #dlgBtns{flex-direction:row;width:100%;justify-content:flex-end}
  #dlgNext{flex:1 1 auto}
}
@media (max-height:480px) and (orientation:landscape){
  #dialog{padding:8px 12px;width:min(900px,calc(100vw - 20px))}
  #dlgPortrait{width:58px;height:58px}
  #dlgText{font-size:22px;min-height:0}
  #dlgBtns{flex-direction:row}
}

/* ---------- banner (Great job!) ---------- */
#banner{position:fixed;z-index:40;left:50%;top:40%;transform:translate(-50%,-50%);padding:16px 34px;font-size:clamp(34px,7vw,64px);font-weight:bold;color:#fff;
  background:linear-gradient(#ffc23c,#ff8c42);border:6px solid #fff;border-radius:34px;box-shadow:0 12px 30px rgba(0,0,0,.25);
  text-shadow:0 3px 0 rgba(0,0,0,.18);white-space:nowrap;pointer-events:none;animation:bannerIn .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes bannerIn{from{transform:translate(-50%,-50%) scale(.2);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.flyStar{position:fixed;z-index:45;font-size:64px;pointer-events:none;transition:transform .9s cubic-bezier(.5,-0.3,.7,1),opacity .9s}

/* ---------- overlays (title, menu) ---------- */
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-start;justify-content:flex-start;padding:16px;background:rgba(40,28,18,.45);overflow:auto;-webkit-overflow-scrolling:touch}
.overlay>*{margin:auto}
.panel{width:min(420px,100%);padding:20px;display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.panel h2{margin:0 0 4px;font-size:30px}
.panel p{margin:0;font-size:22px}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.btn.sel{background:var(--green);box-shadow:0 0 0 4px #fff inset,0 5px 0 rgba(0,0,0,.18)}
.btn.unsel{background:#c9bfb4}
#ask{z-index:55}
/* ---------- chunky game buttons ---------- */
.gbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:74px;padding:0 24px;border:4px solid #fff;border-radius:26px;
  font-family:var(--font);font-weight:bold;font-size:30px;color:#fff;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;outline:none;
  background:linear-gradient(#8be37f,#45b84f 58%,#35a241);box-shadow:0 7px 0 #24792f,0 16px 26px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.28);
  transition:transform .08s,box-shadow .08s}
.gbtn::before{content:'';position:absolute;left:14px;right:14px;top:5px;height:40%;border-radius:18px 18px 40px 40px;
  background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.06));pointer-events:none}
.gbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #24792f,0 6px 12px rgba(0,0,0,.25)}
.gbtn:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.gbtn.orange{background:linear-gradient(#ffc56e,#ff8c42 58%,#f0782a);box-shadow:0 7px 0 #b8541b,0 16px 26px rgba(0,0,0,.3)}
.gbtn.orange:active{box-shadow:0 2px 0 #b8541b,0 6px 12px rgba(0,0,0,.25)}
.gbtn .gi{font-size:34px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
/* ---------- main menu over the live village ---------- */
#title{z-index:35;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 35%,rgba(20,40,30,.42) 100%),linear-gradient(rgba(140,210,255,.3),rgba(0,0,0,0) 35%)}
#titleBox{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;width:min(600px,100%)}
.titleL,.titleR{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.logo{position:relative;padding-top:18px}
.logoSun{position:absolute;left:-34px;top:-10px;width:112px;height:112px;z-index:0;animation:sunBob 4s ease-in-out infinite}
.sunRays{position:absolute;inset:0;border-radius:50%;animation:spin 24s linear infinite;
  background:repeating-conic-gradient(from 0deg,rgba(255,206,64,.95) 0deg 11deg,rgba(255,206,64,0) 11deg 30deg);
  -webkit-mask:radial-gradient(circle,transparent 38%,#000 39%,#000 70%,transparent 71%);mask:radial-gradient(circle,transparent 38%,#000 39%,#000 70%,transparent 71%)}
.sunFace{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:58px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sunBob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6px) rotate(6deg)}}
#titleText{position:relative;z-index:1;margin:0;font-family:var(--logo);font-size:clamp(54px,12.5vw,100px);line-height:1;font-weight:900;letter-spacing:2px;color:#ffe066;white-space:nowrap;
  -webkit-text-stroke:5px #5a2f14;paint-order:stroke fill;
  text-shadow:0 5px 0 #ff9f2b,0 9px 0 #d9731f,0 12px 0 #5a2f14,0 22px 26px rgba(0,0,0,.4)}
#titleText span{display:inline-block;animation:letterBob 2.8s ease-in-out infinite}
@keyframes letterBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.ribbon{position:relative;display:inline-block;padding:8px 30px;background:linear-gradient(#ff7a5c,#e8503a);color:#fff;font-weight:bold;font-size:22px;
  border-radius:10px;box-shadow:0 5px 0 #a8321f,0 12px 18px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.22);white-space:nowrap}
.contBtn{min-height:104px;justify-content:flex-start;padding:0 18px 0 12px;text-align:left}
#tMe{width:74px;height:74px;border-radius:50%;border:4px solid #fff;flex:0 0 auto;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.contText{display:flex;flex-direction:column;flex:1 1 auto;min-width:0;gap:2px}
.contLbl{font-size:34px;line-height:1.05}
.contInfo{display:flex;flex-wrap:wrap;column-gap:14px;font-size:20px;line-height:1.2;opacity:.95}
.contInfo span{white-space:nowrap}
.contInfo .ciName{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tSmall{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pill{min-height:56px;min-width:56px;padding:0 18px;border:4px solid #fff;border-radius:28px;background:rgba(255,255,255,.9);cursor:pointer;
  font-family:var(--font);font-weight:bold;font-size:22px;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.18),0 10px 18px rgba(0,0,0,.2);
  touch-action:manipulation;transition:transform .08s}
.pill:active{transform:translateY(3px) scale(.96)}
#titleCredit{color:#fff;font-size:20px;font-weight:bold;text-shadow:0 2px 3px rgba(0,0,0,.6)}
@media (max-height:560px) and (min-aspect-ratio:5/4){
  #title.overlay{padding:8px 12px}
  #titleBox{flex-direction:row;align-items:center;gap:20px;width:min(940px,100%)}
  .titleL{flex:0 1 auto;width:auto;min-width:0;gap:12px}
  .titleR{flex:1 1 0;min-width:0;gap:10px}
  #titleText{font-size:clamp(42px,8vw,88px);letter-spacing:1px}
  .logoSun{width:84px;height:84px;left:-24px;top:-6px}
  .sunFace{font-size:44px}
  .ribbon{font-size:20px;padding:6px 16px}
  .gbtn{min-height:62px;font-size:26px;padding:0 16px}
  .gbtn .gi{font-size:28px}
  .contBtn{min-height:76px;padding:0 12px 0 8px}
  #tMe{width:56px;height:56px;border-width:3px}
  .contLbl{font-size:28px}
  .tSmall{gap:8px}
  .pill{padding:0 14px}
}
@media (max-height:400px) and (min-aspect-ratio:5/4){
  .titleR{gap:8px}
  .contBtn{min-height:66px}
  .gbtn{min-height:58px}
  #titleCredit{font-size:20px;line-height:1.1}
}
/* ---------- pause menu ---------- */
#menu{background:rgba(25,35,30,.38);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.pause{width:min(740px,100%);display:flex;flex-direction:column;overflow:hidden;background:var(--cream);border:5px solid #fff;border-radius:32px;
  box-shadow:0 22px 50px rgba(0,0,0,.4);animation:cardPop .2s ease-out}
@keyframes cardPop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.pauseHead{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 22px;background:linear-gradient(#ffc94c,#ff9b3d);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.pauseHead h2{margin:0;font-family:var(--logo);flex:1 1 auto;font-size:34px;color:#fff;-webkit-text-stroke:3px #7a3d12;paint-order:stroke fill;text-shadow:0 4px 0 #7a3d12}
.headChips{display:flex;gap:8px}

/* ---------- toast (short feedback) ---------- */
#toast{position:fixed;z-index:42;left:50%;top:calc(84px + env(safe-area-inset-top));transform:translateX(-50%);max-width:calc(100vw - 20px);
  padding:8px 22px;background:#fff;border:4px solid var(--green);border-radius:24px;box-shadow:var(--shadow);font-size:26px;font-weight:bold;
  text-align:center;white-space:nowrap;pointer-events:none;animation:toastIn .3s cubic-bezier(.2,1.5,.4,1)}
#toast.bad{border-color:var(--pink)}
@keyframes toastIn{from{opacity:0;margin-top:-16px}to{opacity:1;margin-top:0}}
@media (max-width:640px){#toast{top:calc(126px + env(safe-area-inset-top));font-size:22px}}

#mg{z-index:25}

.pick{background:#fff;border:4px solid #fff;border-radius:22px;box-shadow:0 4px 0 rgba(0,0,0,.12),var(--shadow);cursor:pointer;padding:6px;margin:0;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font-family:var(--font);font-weight:bold;font-size:22px;color:var(--ink);

.pick:active{transform:scale(.94)}
.pick canvas{display:block;width:100%;height:auto;pointer-events:none}
.pick > span.fit{display:block;max-width:100%;overflow:hidden;overflow-wrap:normal;word-break:normal;hyphens:none}
.pick.ok{border-color:var(--green);background:#e6ffe6}
.pick.sel{border-color:var(--orange);background:#fff3e0}

.photo{background:linear-gradient(#bfeaff 0%,#e3f6ff 58%,#b4ea86 58.1%,#9ddc6e 100%);border:10px solid #c98552;border-radius:16px;
  box-shadow:inset 0 0 0 3px #a8693a,var(--shadow);padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo .pick{background:rgba(255,255,255,.35);border-color:rgba(255,255,255,.7);box-shadow:none}

.whereWrap{display:flex;gap:12px;align-items:stretch}
.whereWho{flex:0 0 150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:22px;font-weight:bold;text-align:center}
.whereWho canvas{width:130px;height:130px;border-radius:50%;border:4px solid #fff;box-shadow:var(--shadow)}
.whereRow{flex:1 1 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.slot{min-height:150px;border:4px dashed #d9c3a0;border-radius:22px;display:flex;align-items:stretch;justify-content:center;position:relative;padding:4px}

.slot .pick{width:100%}
.tfRow{display:flex;gap:20px;justify-content:center}
.tfBtn{font-size:72px;min-width:150px;min-height:120px;border-radius:30px}
.tfBtn.up{background:var(--green)} .tfBtn.down{background:#ff8a5c}
.tfBtn.ok{box-shadow:0 0 0 5px #fff,0 0 0 10px var(--green)}
.say{font-size:clamp(22px,3vw,30px);font-weight:bold;background:#fff7d6;border-radius:18px;padding:10px 14px;text-align:center}
.famPhoto{width:auto;height:auto;max-width:100%;max-height:36vh;margin:0 auto;display:block;border:10px solid #c98552;border-radius:16px;box-shadow:inset 0 0 0 3px #a8693a,var(--shadow)}
.famGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;align-items:start}
.famGrid .pick canvas{width:auto;height:84px}
.badge{position:absolute;top:-8px;right:-8px;min-width:32px;height:32px;border-radius:16px;background:var(--orange);color:#fff;font-size:20px;
  display:flex;align-items:center;justify-content:center;border:3px solid #fff;padding:0 4px}
.undoRow{display:flex;justify-content:flex-end}
.ageRow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ageRow .pick{font-size:48px;min-height:100px;justify-content:center}
.flagGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.flagGrid .pick{font-size:20px;line-height:1.1}
.lines div{font-size:clamp(22px,3vw,30px);font-weight:bold;padding:4px 10px;border-radius:12px;transition:background .15s}
.lines div.now{background:#ffe066}
@media (max-width:620px){
  #mgCard{padding:10px;gap:10px}
  #mgPortrait{width:48px;height:48px}
  #mgPrompt{font-size:22px}
  .photo{padding:6px;border-width:7px;gap:5px}
  .whereWrap{flex-direction:column}
  .whereWho{flex:0 0 auto;flex-direction:row}
  .whereWho canvas{width:84px;height:84px}
  .tfBtn{min-width:120px;min-height:100px;font-size:60px}

  rrect(g, 36, -200, 22, 46, 3, '#d9745a', 3);

  g.beginPath(); g.moveTo(-hw - 16, -80); g.lineTo(hw + 16, -80); g.lineTo(hw - 6, -172); g.lineTo(-hw + 6, -172); g.closePath();
  paint(g, o.roof, 3);
  g.save(); g.clip(); g.strokeStyle = shade(o.roof, -0.2); g.lineWidth = 2.5;
  let row = 0;
  for (let y = -160; y < -76; y += 17, row++) {
    for (let x = -hw - 20 + (row % 2) * 9; x < hw + 20; x += 18) { g.beginPath(); g.arc(x, y, 9, 0.1, Math.PI - 0.1); g.stroke(); }
  }
  g.restore();
  rrect(g, -hw + 2, -180, hw * 2 - 4, 13, 6, shade(o.roof, -0.22), 3);
  g.fillStyle = 'rgba(74,50,34,.18)'; g.fillRect(-hw + 3, -80, hw * 2 - 6, 7);
  if (o.heart) {
    g.save(); g.translate(0, -130);
    g.beginPath(); g.moveTo(0, 8); g.bezierCurveTo(-16, -4, -8, -16, 0, -7); g.bezierCurveTo(8, -16, 16, -4, 0, 8); paint(g, '#ff7aa2', 3);
    g.restore();
  } else {
    circ(g, 0, -128, 13, '#ffffff', 3); circ(g, 0, -128, 9, '#aee3ff', 0);
    seg(g, -9, -128, 9, -128, '#fff', 2.5); seg(g, 0, -137, 0, -119, '#fff', 2.5);
  }
  winP(g, -66, -68, 36, 32, { curtain: o.curtain });
  winP(g, 30, -68, 36, 32, { curtain: o.curtain });
  doorP(g, 0, 0, 34, 56, o.door);
  rrect(g, -24, -4, 48, 8, 3, '#d7ccc0', 2.5);
}

/* ---- Nomi's animals (Quest 4): they wander, follow you, and walk into the pen ---- */
const PEN_GATE = ATP('tent', -8, 140);
// where each animal wanders off to: east by the orchard, south by the forest, and the flower meadow
const HERD_DEFS = [
  { id: 'goat', area: { x0: 1760, y0: 1080, x1: 2060, y1: 1220 }, pen: ATP('tent', -162, 115) },
  { id: 'lamb', area: { x0: 1260, y0: 1260, x1: 1440, y1: 1360 }, pen: ATP('tent', -118, 190) },
  { id: 'horse', area: { x0: 180, y0: 700, x1: 560, y1: 960 }, pen: ATP('tent', -82, 118) },
];
const HERD = [];
function initHerd() {
  for (const d of HERD_DEFS) {
    const a = {
      id: d.id, kind: d.id, x: d.pen.x, y: d.pen.y, face: 1, phase: 0, moving: false, st: 'pen', area: d.area, pen: d.pen,
      path: null, pathI: 0, wait: 1, stuck: 0, R: rng(d.pen.x * 13 + d.pen.y), t0: d.pen.x * 0.01,
      b: d.id === 'horse' ? [-50, -104, 60, 8] : [-32, -58, 36, 8],
    };
    a.draw = function (c, t) {
      const o = { x: this.x, y: this.y, face: this.face, moving: this.moving, phase: this.phase, t: t + this.t0 };
      if (this.kind === 'goat') drawGoat(c, o); else if (this.kind === 'lamb') drawLamb(c, o); else drawHorse(c, o);
    };
    HERD.push(a);
  }
}
function placeHerd() {
  const C = Quests.content(), out = C && C.id === 'animals';
  for (const a of HERD) {
    a.path = null; a.moving = false;
    if (!out || (state.q.home && state.q.home.indexOf(a.id) >= 0)) { a.st = 'pen'; a.x = a.pen.x; a.y = a.pen.y; a.face = 1; }
    else { a.st = 'wander'; const p = randomFreePoint(a.area, a.R); if (p) { a.x = p.x; a.y = p.y; } }
  }
}
function updateHerd(dt) {
  const C = Quests.content(), active = C && C.id === 'animals' && state.stage === 'active' && game.mode === 'play';
  let fi = 0;
  for (const a of HERD) {
    if (a.st === 'pen') { a.moving = false; continue; }
    if (a.st === 'going') {
      if (a.path) followPath(a, dt, 80);
      if (!a.path) { a.st = 'pen'; a.moving = false; if (Math.hypot(a.x - a.pen.x, a.y - a.pen.y) > 30) { a.x = a.pen.x; a.y = a.pen.y; } }
      continue;
    }
    if (a.st === 'follow') {
      updateFollower(a, 80 + fi * 40, dt); fi++;
      // in they go once you reach the pen with them (the last one may still be a few steps behind)
      if (Math.hypot(a.x - PEN_GATE.x, a.y - PEN_GATE.y) < 110 || Math.hypot(player.x - PEN_GATE.x, player.y - PEN_GATE.y) < 120) {
        a.st = 'going'; a.path = findPath(a.x, a.y, a.pen.x, a.pen.y); a.pathI = 0;
        if (state.q.home.indexOf(a.id) < 0) state.q.home.push(a.id);
        Sfx.play('ok'); Toast.show('🏠 ' + (C.sounds[a.kind] || '')); Speech.speak(C.sounds[a.kind] || '', { who: 'nomi' });
        saveAndRefresh();
      }
      continue;
    }
    if (game.mode !== 'play') { a.moving = false; continue; }
    // a runaway animal stands still and waits once you come close, so it is easy to catch
    if (active && Math.hypot(player.x - a.x, player.y - a.y) < 150) { a.moving = false; a.path = null; }
    else if (a.path) followPath(a, dt, 34);
    else {
      a.moving = false;
      if ((a.wait -= dt) < 0) { a.wait = 2 + a.R() * 3; const p = randomFreePoint(a.area, a.R); if (p) { a.path = findPath(a.x, a.y, p.x, p.y); a.pathI = 0; } }
    }
    if (active && Math.hypot(player.x - a.x, player.y - a.y) < 72) {
      a.st = 'follow'; a.path = null; Sfx.play('pop');
      Toast.show(C.sounds[a.kind] || ''); Speech.speak(C.sounds[a.kind] || '', { who: 'nomi' });
    }
  }
}

      if (instant) { const p = randomFreePoint(MAP.wander, R); if (p) { n.x = p.x; n.y = p.y; } }
    } else sendHome(n, instant);
  }
  const L = Quests.logic(), C = Quests.content();
  if (instant) {
    if (L && L.restore) L.restore();
    NPC.pip.sleeping = NPC.pop.sleeping = false; game.sleepT = 0;
  }
  if (instant || (C && C.id === 'animals')) placeHerd();
  LANDMARK.myHouse.unlocked = state.quest >= Quests.index('final');
}

/* ============================== MİNİ OYUNLAR ============================== */
/* Her mini oyun ayrı bir fonksiyon: MINI.<ad>(C, bitince). C = görevin GAME_CONTENT kaydı.
   Yeni bir ünite için mini oyunu olduğu gibi bırakıp yalnızca GAME_CONTENT'i değiştirmek yeterli.
   Ortak parçalar: MG (açılır pencere), pickBtn (resimli buton), sayThen (konuş, bitince devam et). */
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
// a label that is wider than its card (one long word) gets a slightly smaller font, never a broken word
function fitText(s) {
  if (!s.isConnected) return;
  s.style.fontSize = '';
  let f = parseFloat(getComputedStyle(s).fontSize) || 22;
  while (s.scrollWidth > s.clientWidth + 1 && f > 14) { f -= 1; s.style.fontSize = f + 'px'; }
}
function cnv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function fmt(s, vars) { return fillName(String(s).replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] != null ? vars[k] : m))); }
function speechMs(text) { const r = Speech.rate(); return String(text).split(' ').reduce((a, w) => a + (0.12 + w.length * 0.065) / r, 0.3) * 1000; }
/* Speak, then run cb once when the voice finishes, or after a safe timeout if it never reports back. */
function sayThen(text, who, cb) {
  const h = { dead: false, t: 0, cancel() { this.dead = true; clearTimeout(this.t); } };
  const fin = () => { if (h.dead) return; h.dead = true; clearTimeout(h.t); if (cb) cb(); };
  const est = speechMs(text);
  const ok = Speech.speak(text, { who, onEnd: fin });
  h.t = setTimeout(fin, ok ? est * 1.8 + 1500 : 600 + est * 0.5);
  return h;
}
function pickBtn(draw, label, cw, ch, cls) {
  const b = el('button', 'pick' + (cls ? ' ' + cls : ''));
  if (draw) { const c = cnv(cw || 180, ch || 200); draw(c); b.appendChild(c); }
  if (label) { const s = el('span', 'fit', String(label)); b.appendChild(s); requestAnimationFrame(() => fitText(s)); }
  return b;
}
const MG = {                      // the mini game window
  token: 0, who: 'sparky', speech: null, onQuit: null, onReplay: null, text: '',
  open(who, onQuit) {
    this.token++; this.who = who; this.onQuit = onQuit || null; this.onReplay = null;
    if (this.speech) this.speech.cancel();
    drawPortrait($('mgPortrait'), who);
    $('mgBody').innerHTML = ''; $('mgDots').innerHTML = ''; $('mgPrompt').textContent = '';
    this.next(null);
    $('mg').classList.remove('hidden'); $('mgCard').scrollTop = 0;
    setMode('minigame'); Talk.hide();
    return this.token;
  },
  alive(tok) { return tok === this.token && game.mode === 'minigame'; },
  prompt(text, speak) { this.text = text; $('mgPrompt').textContent = text; if (speak !== false) this.say(text); },
  say(text, cb) { if (this.speech) this.speech.cancel(); this.speech = sayThen(text, this.who, cb); },
  replay() { if (this.onReplay) this.onReplay(); else if (this.text) this.say(this.text); },
  dots(i, n) { const d = $('mgDots'); d.innerHTML = ''; for (let k = 0; k < n; k++) d.appendChild(el('span', k < i ? 'on' : k === i ? 'cur' : '')); },
  next(label, fn) {
    const b = $('mgNext');
    if (!label) { b.classList.add('hidden'); b.onclick = null; return; }
    b.textContent = label; b.classList.remove('hidden');
    b.onclick = (e) => { e.stopPropagation(); b.blur(); Sfx.play('tap'); fn(); };
  },
  close() {
    this.token++; if (this.speech) this.speech.cancel(); this.speech = null; this.onReplay = null;
    Speech.stop(); $('mg').classList.add('hidden'); setMode('play'); Hud.refresh();
  },
  quit() { const f = this.onQuit; this.close(); if (f) f(); },
  wrong(btn, correct, count, hintAfter) {       // gentle sound, "Try again!", then a glowing hint
    Sfx.play('no');
    btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
    Toast.show(GAME_CONTENT.ui.tryAgain, true);
    this.say(GAME_CONTENT.ui.tryAgain);
    if (correct && count >= (hintAfter || 2)) correct.classList.add('hint');
  },
};

    b.dataset.v = r; btns[r] = b; photo.appendChild(b);
  }
  $('mgBody').appendChild(photo);
  let i = 0, wrongs = 0, busy = false;
  const ask = () => {
    if (!MG.alive(tok)) return;

    wrongs = 0; busy = false;

MINI.sequence = function (C, done) {       // Görev 6: put the bedtime cards in order
  const tok = MG.open('lily');
  const slots = el('div', 'seqSlots'), cards = el('div', 'seqCards'), sl = [], bs = [];
  for (let k = 0; k < C.steps.length; k++) { const s = el('div', 'slot'); s.appendChild(el('b', null, String(k + 1))); slots.appendChild(s); sl.push(s); }
  $('mgBody').append(slots, cards);
  C.steps.forEach((st, idx) => { const b = pickBtn((cv) => drawStepIcon(cv, st.icon), st.text, 200, 140); b._idx = idx; b.dataset.v = idx; bs.push(b); });
  for (const b of shuffle(bs)) cards.appendChild(b);
  let next = 0, wrongs = 0, busy = false;
  const ask = () => { MG.dots(next, C.steps.length); MG.prompt(C.sortPrompts[Math.min(next, C.sortPrompts.length - 1)]); };
  for (const b of bs) b.addEventListener('click', () => {
    if (busy || b._placed || !MG.alive(tok)) return;
    if (b._idx === next) {
      busy = true; b._placed = true; Sfx.play('ok'); b.classList.remove('hint', 'shake'); b.classList.add('ok');
      sl[next].appendChild(b); next++; wrongs = 0;
      MG.say(C.steps[b._idx].text, () => {
        if (!MG.alive(tok)) return;
        if (next < C.steps.length) { busy = false; ask(); return; }
        MG.dots(next, C.steps.length);
        const all = C.steps.map((s) => s.text).join('. ') + '.';
        $('mgPrompt').textContent = all; MG.text = all;
        MG.say(all, () => { if (MG.alive(tok)) { MG.close(); done(); } });
      });
    } else { wrongs++; MG.wrong(b, bs[next], wrongs, C.hintAfter); }
  });
  ask();
};

function familySentences(C) {              // "This is my family. I have a mother, one sister and two cousins. ..."
  const S = C.sentences, out = [S.family], parts = [];
  for (const m of C.members) {
    const n = (state.family && state.family[m]) || 0;
    if (!n) continue;
    const word = n === 1 ? m : (C.plurals[m] || m + 's');
    const num = n === 1 && C.useA.indexOf(m) >= 0 ? (/^[aeiou]/i.test(word) ? 'an' : 'a') : (C.numbers[n] || String(n));
    parts.push(num + ' ' + word);
  }
  if (parts.length) {
    const list = parts.length > 1 ? parts.slice(0, -1).join(', ') + ' ' + C.and + ' ' + parts[parts.length - 1] : parts[0];
    out.push(fmt(S.have, { list }));
  }
  out.push(fmt(S.age, { age: C.numbers[state.age] || state.age }));
  const co = C.countries.find((x) => x.id === state.country) || C.countries[0];
  out.push(fmt(S.from, { country: co.name }));
  return out;
}

  MG.onReplay = read;
  MG.next(GAME_CONTENT.ui.done + ' ✔', () => { MG.close(); done(); });
  read();
};

/* Eight surprises hidden around the village. Finding them is optional; the menu and the certificate
   count them. Each one works in both views: draw2D for the flat view, draw3 for the 3D view. */
const EGGS = {
  ids: ['cat', 'fountain', 'stones', 'ducks', 'frog', 'scarecrow', 'rabbit', 'treasure'],
  cat: { awake: 0 }, fountain: { rainbow: 0 }, stones: { list: [], glow: [0, 0, 0, 0, 0], on: [], hit: {} },
  ducks: { cx: 1640, cz: 1500, rx: 40, rz: 24 },      // near the west shore, away from Captain Bob's dock
  frog: { pads: [[1535, 1600], [1568, 1642]], pad: 0, jump: 0 },
  scarecrow: { x: 1990, y: 690, wave: 0 }, rabbit: { holes: [[300, 780], [470, 900], [610, 790]], hole: 0, up: 0, stay: 0, wait: 2 },
  treasure: { x: 630, y: 1580, open: 0 }, kite: { x: 230, y: 930 }, mill: null,
  NOTES: [523, 587, 659, 698, 784],
  COLS: ['#ff6b6b', '#ffb238', '#ffe14a', '#5fd07a', '#5aa9ff'],
  // map placement: called from initMap, before the trees are scattered
  place() {
    const bench = LANDMARK.benchL, st = this.stones;
    const p0 = [1450, 1120], p1 = [1640, 1220];
    for (let i = 0; i < 5; i++) { const k = 0.1 + i * 0.2; st.list.push([p0[0] + (p1[0] - p0[0]) * k, p0[1] + (p1[1] - p0[1]) * k]); st.on.push(false); }
    for (const p of this.frog.pads) MAP.lilies.push(p);
    const S = this.scarecrow, T = this.treasure, K = this.kite;
    SOLIDS.push(C_(S.x, S.y, 9), R_(T.x - 23, T.y - 16, T.x + 23, T.y + 3));
    KEEP.push(C_(S.x, S.y, 40), C_(T.x, T.y, 85), C_(K.x, K.y, 30), C_(...AT('farm', 270, 170), 95));
    // décor: windmill, meadow picnic, orchard, rabbit holes
    const [mx, my] = AT('mill');
    this.mill = { x: mx, y: my };
    spriteAt('windmill', mx, my, { occ: true }); SOLIDS.push(C_(mx, my - 28, 38)); KEEP.push(C_(mx, my - 20, 120));
    spriteAt('picnic', 620, 990); SOLIDS.push(R_(628, 972, 648, 986)); KEEP.push(R_(560, 950, 690, 1030));
    KEEP.push(R_(150, 690, 700, 1010));                                  // the flower meadow stays open
    const Rm = rng(31), FLC = ['#ff7aa2', '#ffd23c', '#ffffff', '#b58cff', '#ff9f43', '#ff5a5a'];
    MAP.meadowFlowers = [];
    for (let i = 0; i < 170; i++) {
      const x = 170 + Rm() * 510, y = 710 + Rm() * 290, col = FLC[(Rm() * FLC.length) | 0];
      if (x > 560 && x < 690 && y > 950) continue;
      if (this.rabbit.holes.some((h) => Math.hypot(h[0] - x, h[1] - y) < 26) || nearPath(x, y, 6)) continue;
      MAP.meadowFlowers.push([x, y, col]);
    }
    for (const h of this.rabbit.holes) spriteAt('hole', h[0], h[1]);
    const [ox, oy] = AT('orchard');
    for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) { const x = ox - 110 + i * 110 + (j ? 40 : 0), y = oy - 70 + j * 120; addTree('apple', x, y); KEEP.push(C_(x, y, 50)); }
    spriteAt('crate', ox - 40, oy + 20); SOLIDS.push(R_(ox - 57, oy + 8, ox - 23, oy + 22));
    spriteAt('crate', ox + 60, oy + 26); SOLIDS.push(R_(ox + 43, oy + 14, ox + 77, oy + 28));
    KEEP.push(R_(ox - 170, oy - 120, ox + 170, oy + 120));
    // the surprises that move are drawn by the flat view through these y-sorted drawables
    const add = (x, y, b, fn) => addStatic({ x, y, b, draw: fn });
    add(bench.x - 12, bench.y + 1, [-24, -60, 24, 6], (c, t) => this.cat2D(c, t));
    add(S.x, S.y, [-40, -90, 40, 8], (c, t) => this.scarecrow2D(c, t));
    add(T.x, T.y, [-24, -40, 24, 6], (c, t) => this.chest2D(c, t));
    for (const h of this.rabbit.holes) add(h[0], h[1] + 1, [-20, -50, 20, 6], (c, t) => this.rabbit2D(c, t, h));
    add(K.x, K.y, [-10, -30, 10, 4], (c) => { rrect(c, K.x - 2, K.y - 16, 4, 16, 2, '#8a5a30', 2); });
    add(mx, my + 1, [-80, -190, 80, 8], (c, t) => this.blades2D(c, t));
  },
  reset() {                        // back to the start (used by Restart)
    this.cat.awake = 0; this.fountain.rainbow = 0; this.scarecrow.wave = 0; this.treasure.open = 0;
    const st = this.stones; st.glow.fill(0); st.on.fill(false); st.hit = {};
    this.frog.pad = 0; this.frog.jump = 0;
    Object.assign(this.rabbit, { hole: 0, up: 0, stay: 0, wait: 2 });
  },
  found(id) {
    state.eggs = state.eggs || {};
    if (state.eggs[id]) return;
    state.eggs[id] = 1; Save.save();
    const n = this.count(), T = GAME_CONTENT.secrets;
    setTimeout(() => { Sfx.play('star'); Toast.show('🔍 ' + T.found + ' ' + n + '/' + this.ids.length); }, 250);
  },
  count() { return this.ids.filter((i) => state.eggs && state.eggs[i]).length; },
  say(id, done) {
    const T = GAME_CONTENT.secrets[id];
    Dialog.show(T.map((s) => [id === 'ducks' ? 'duck' : id, s]), () => { this.found(id); if (done) done(); });
  },
  shout(id) { const s = GAME_CONTENT.secrets[id]; Toast.show('✨ ' + s); Speech.speak(s, { who: 'narrator' }); this.found(id); },
  duckPos(k, t) {

/* ============================== ARAYÜZ ============================== */
const game = { mode: 'title', t: 0, paused: false, sleepT: 0, ev: 0 };
// While one of these full-screen windows is open the village is not updated or redrawn.
const FROZEN = { title: 1, parent: 1, creator: 1, minigame: 1, menu: 1, wardrobe: 1, cert: 1, ask: 1 };
// ...except these, where the village is shown from a slow sightseeing camera behind the menu
const BACKDROP = { title: 1, parent: 1, creator: 1 };
function setMode(m) { game.mode = m; }
function fillName(s) { return String(s).replace(/\{name\}/g, state.name || GAME_CONTENT.defaultName); }
function charName(id) { const c = GAME_CONTENT.characters[id]; return c ? fillName(c.name) : id; }

/* ---- interaction ---- */
function interactables() {
  const list = [];
  for (const n of NPCS) {
    if (n.hidden || n.follow || n.sleeping) continue;
    list.push({ id: n.id, x: n.x, y: n.y, npc: n, topY: n.y + n.top, label: 'talk' });
  }
  if (Quests.content() && Quests.content().id === 'brother' && state.stage === 'search') {
    const th = LANDMARK.treehouse;
    list.push({ id: 'treehouse', x: th.x + 34, y: th.y + 14, topY: th.y - 190, label: 'talk' });
  }
  const L = Quests.logic();
  if (L && L.interactables) L.interactables(list);
  EGGS.interactables(list);
  const mr = LANDMARK.mirror;
  list.push({ id: 'mirror', x: mr.x, y: mr.y + 8, topY: mr.y - 90, label: 'look', act: () => Wardrobe.open() });
  if (LANDMARK.myHouse.unlocked) {
    list.push({ id: 'door', x: DOOR.x, y: DOOR.y, topY: DOOR.y - 84, label: 'open', act: () => {
      if (state.finished) Cert.open(); else if (Quests.content() && Quests.content().id === 'final') QUEST_LOGIC.final.open(Quests.content());
    } });
  }
  return list;
}
function nearestInteractable() {
  let best = null, bd = 1e9;
  for (const it of interactables()) {
    const d = Math.hypot(it.x - player.x, (it.y - player.y) * 1.3);
    if (d <= (it.range || SETTINGS.talkRange) && d < bd) { bd = d; best = it; }
  }
  return best;
}
function interact(it) {
  if (!it || game.mode !== 'play') return;

/* ---- dialog box with karaoke highlighting ---- */
const Dialog = {

  words: [], offs: [], boundary: false, fbTimer: 0, fbStarted: false, mouthTimer: 0,
  show(lines, done) {
    this.lines = lines.map((l) => (typeof l === 'string' ? [null, l] : l));
    this.i = 0; this.done = done || null; this.open = true;
    setMode('dialog');
    const el = $('dialog');
    el.classList.remove('hidden', 'pop'); void el.offsetWidth; el.classList.add('pop');
    $('talkWrap').classList.add('hidden');

  },
  render() {

    $('dlgName').classList.toggle('hidden', !who);
    drawPortrait($('dlgPortrait'), who || 'sparky');
    const t = $('dlgText'); t.innerHTML = '';
    const box = document.createElement('div');
    this.words = []; this.offs = [];

      const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = w; box.appendChild(sp);
      if (i < a.length - 1) box.appendChild(document.createTextNode(' '));
      this.words.push(sp); this.offs.push(off); off += w.length + 1;
    });

    $('dlgNext').textContent = last ? GAME_CONTENT.ui.ok + ' 👍' : GAME_CONTENT.ui.next + ' ▶';
    this.h = $('dialog').offsetHeight + 16;
    this.say();
  },
  say() {
    clearTimeout(this.fbTimer); clearTimeout(this.mouthTimer);
    this.boundary = false; this.fbStarted = false; this.mark(-1);
    const who = this.who, text = this.text, rate = Speech.rate();
    const ok = Speech.speak(text, {
      who: who || 'narrator',
      onStart: () => this.fallback(),
      onBoundary: (ci) => { this.boundary = true; let k = 0; while (k + 1 < this.offs.length && this.offs[k + 1] <= ci) k++; this.mark(k); },
      onEnd: () => { this.mark(this.words.length); this.mouth = null; },

      if (this.boundary || !this.open || i >= this.words.length) return;

      i++;
      this.fbTimer = setTimeout(step, dur);
    };
    step();
  },
  mark(k) {

  },
  next() {

/* ---- full screen ----
   Phones and tablets go full screen when the game starts (it needs a tap, so it happens on New Game /

/* ---- which device: phone, tablet or computer ----

   they are Macs, so a "Mac" with a touch screen is an iPad. Phone or tablet goes by the screen's short side. */
const Device = {
  kind: 'computer', touch: false, os: 'other', done: false,
  detect() {
    this.done = true;
    const mq = (q) => { try { return window.matchMedia(q).matches; } catch (e) { return false; } };
    const ua = navigator.userAgent || '', tp = navigator.maxTouchPoints || 0;
    const iPad = /iPad/.test(ua) || (/Macintosh/.test(ua) && tp > 1);
    const phoneUA = /iPhone|iPod|Windows Phone|Mobile/i.test(ua) || !!(navigator.userAgentData && navigator.userAgentData.mobile);
    const tabletUA = iPad || /Tablet|Kindle|Silk|PlayBook/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua));
    this.touch = mq('(pointer: coarse)') || (mq('(hover: none)') && tp > 0) || phoneUA || tabletUA;
    const short = Math.min(screen.width || innerWidth, screen.height || innerHeight);
    this.kind = !this.touch ? 'computer' : tabletUA || (!phoneUA && short >= 600) ? 'tablet' : 'phone';
    this.os = iPad || /iPhone|iPod/.test(ua) ? 'ios' : /Android/i.test(ua) ? 'android' : /Windows/i.test(ua) ? 'windows' : /Macintosh/.test(ua) ? 'mac' : 'other';

/* Touch controls: a joystick under the left thumb (it comes to wherever the thumb lands in the
   bottom-left corner) and a big action button under the right thumb that shows what it will do. */
const Touch = {
  on: false, shown: null, lbl: null, zone: null, base: null, knob: null, btn: null,
  init() {

    if (Device.touch) this.enable();

    const z = this.zone;

    };

/* ---- celebration: confetti, banner, flying star ---- */
const Fx = {
  cv: null, g: null, parts: [], live: false,
  resize() { this.cv.width = Math.round(view.cw * view.dpr); this.cv.height = Math.round(view.ch * view.dpr); },
  confetti() {
    const cols = ['#ff5a5a', '#ffd23c', '#4cc36a', '#4aa3ff', '#ff7aa2', '#b58cff', '#ff9f43'];
    for (let i = 0; i < 160; i++) {
      const left = i % 2 === 0;
      this.parts.push({
        x: left ? -10 : view.cw + 10, y: view.ch * (0.55 + Math.random() * 0.3),
        vx: (left ? 1 : -1) * (250 + Math.random() * 450), vy: -(500 + Math.random() * 520),
        r: Math.random() * TAU, vr: (Math.random() - 0.5) * 14, w: 8 + Math.random() * 8, h: 5 + Math.random() * 6,

  update(dt) {

    let alive = 0;

      p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.scale(1, Math.abs(Math.cos(p.r * 1.3)) + 0.2);

};

const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };

    if (e.target && e.target.tagName === 'INPUT') return;
    const k = KEYMAP[e.code];
    if (k) { keys[k] = 1; e.preventDefault(); return; }
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') {
      e.preventDefault();
      if (e.repeat) return;
      if (game.mode === 'dialog') Dialog.next();
      else if (game.mode === 'play' && Talk.it) interact(Talk.it);
      else if (game.mode === 'title') startGame();
      else if (game.mode === 'parent') Parent.start();
      else if (game.mode === 'minigame' && !$('mgNext').classList.contains('hidden')) $('mgNext').click();
    }
    if (e.code === 'Escape') {
      if (game.mode === 'menu') Menu.close();
      else if (game.mode === 'wardrobe') Wardrobe.close();
      else if (game.mode === 'minigame') MG.quit();
    }
  });
  window.addEventListener('keyup', (e) => { const k = KEYMAP[e.code]; if (k) keys[k] = 0; });
  window.addEventListener('blur', () => { keys.up = keys.down = keys.left = keys.right = 0; });
  const cv = $('game');

  cv.addEventListener('pointerdown', (e) => {
    if (game.mode !== 'play') return;
    ptr.down = true; ptr.id = e.pointerId; ptr.last = performance.now();
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* old browsers */ }
    tapAt(e.clientX, e.clientY, false);
  });
  cv.addEventListener('pointermove', (e) => {
    if (!ptr.down || e.pointerId !== ptr.id || game.mode !== 'play') return;
    const now = performance.now();
    if (now - ptr.last > 160) { ptr.last = now; tapAt(e.clientX, e.clientY, true); }
  });
  const up = (e) => { if (e.pointerId === ptr.id) ptr.down = false; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  document.addEventListener('contextmenu', (e) => e.preventDefault());
}

  quickStart(name) {     // skip the parent screen and the creator (tests only)
    state.parentSeen = true; state.created = true; if (name) state.name = name;
    $('parent').classList.add('hidden'); $('creator').classList.add('hidden');
    enterWorld(!state.started);
  },
  step(dt, n = 1) { for (let i = 0; i < n; i++) { update(dt); Fx.update(dt); } this.render(); },
  render() { if (G3.on) g3Render(game.t, 1 / 60); else renderWorld(ctx, cam.x, cam.y, view.pr, view.w, view.h, game.t); Talk.update(); },
  G3, W3, CAM3, setView3,
  tp(x, y) { player.x = x; player.y = y; player.path = null; resetTrail(0, 1); sparky.x = x - 40; sparky.y = y + 46; snapCamera(); },
  overview(k = 0.5) {
    const cv = document.createElement('canvas'); cv.width = W * k; cv.height = H * k;
    renderWorld(cv.getContext('2d'), 0, 0, k, W, H, game.t);
    return cv.toDataURL('image/png');
  },
};
// the lettering comes from the web: wait a moment for it (never long, and not at all without internet)
function fontsReady() {
  try {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    const T = 'AaBbĞğŞşİıÇçÖöÜü 0123!?';
    return Promise.all(['500 20px "M PLUS Rounded 1c"', '700 20px "M PLUS Rounded 1c"', '800 20px "M PLUS Rounded 1c"', '700 20px "Fredoka"']
      .map((f) => document.fonts.load(f, T).catch(() => null)));
  } catch (e) { return Promise.resolve(); }
}
// the loading screen gets painted first, then the village is built (that takes a moment on phones)
requestAnimationFrame(() => Promise.race([fontsReady(), new Promise((ok) => setTimeout(ok, 2500))]).then(() => setTimeout(() => {
  try { boot(); } finally {
    window.SH.booted = true;
    const s = $('splash'); if (s) { s.classList.add('gone'); setTimeout(() => s.remove(), 600); }
  }
}, 30)));
</script>
</body>
